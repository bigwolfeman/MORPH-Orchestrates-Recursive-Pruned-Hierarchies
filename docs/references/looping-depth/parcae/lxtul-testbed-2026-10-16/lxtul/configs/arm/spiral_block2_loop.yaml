# Block-Parcae (series hierarchy): ONE chunk level of 2 tokens (offset 0, shift 2), Parcae's Poisson depth on the chunk
# sequence. The coda reads the token embeddings + the loop state of the PREVIOUS chunk and attends only inside its own
# chunk: the loop is the coda's only route to anything before the chunk. Plain CE through the plain+pointer head.
name: spiral-block2-loop
kind: spiral
pointer_heads: 4
spiral:
  max_depth: 8
  topology: block
  levels:
    - {kind: chunk, size: 2, offset: 0, shift: 2, depth: poisson}
