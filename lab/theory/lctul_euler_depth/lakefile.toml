name = "lctul_euler_depth"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LctulEulerDepth"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[require]]
name = "tul_information"
path = "../tul_information"

[[lean_lib]]
name = "LctulEulerDepth"
