# ARC E12, the k=12 panel (2026-09-07, Wolfe: "a fixed run at k of 12"). M-next-mask (E4's
# arm: slot loop, forecast MUX, tg_restrict so the tokens read the span only through the
# slot) at a FIXED slot depth of 12 instead of the Poisson mean-6 draw. Recipe otherwise
# Y2's (gain hinge 0.9, clip 4.0, the ramp) plus base.yaml's fixed-point term.
# Prereg: lab/experiments/planned/2026-09-07-arc-e12-k12-panel.md
defaults:
  - tul_to_mnext_y2_mask
  - _self_

model:
  bptt_depth: 12                 # full BPTT through all 12 (Y2: 8 = full at max 8)
tul:
  slot_depth_fixed: 12           # EVERY valid slot loops exactly 12 times, train and eval
  slot_max_depth: 12

wandb:
  name: k12-mnext-mask
