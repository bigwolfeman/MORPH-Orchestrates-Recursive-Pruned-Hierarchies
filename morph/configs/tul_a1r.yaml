# TUL arm A1r — A1 repeated at a different seed (docs/tul-spec.md §7.1).
# THE RETRAIN NOISE FLOOR. Read this spread BEFORE reading any A1−A0 difference:
# a byte-identical retrain has moved pass@4 by 4.8 points in earlier work, so an
# unmeasured noise floor turns run-to-run variance into a method claim.
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name tul_a1r
defaults:
  - tul_a1
  - _self_

training:
  seed: 1

wandb:
  name: tul-a1r
