# Y2 — phase 2, lever (b): R4 + clip-through-time (kept as belt) + a hinge penalty on the
# slot map's TYPICAL GAIN, lambda * relu(g - 0.9)^2, g measured every step at one random grad
# iteration by a 2 % finite difference (two extra core steps on the compact slot sequence,
# same dropout masks, global RNG untouched). This is the quantity the onset capture measured
# drifting 0.87 -> 1.00 on the whole map; the four weight-spectrum caps bounded one factor of
# one block and could not see it. lambda 100: 1.0 nat of penalty at g = 1.0, 0.25 at 0.95, 0
# below 0.9 (a healthy map reads 0.87-0.91).
defaults:
  - tul_to_mnext_ctt
  - _self_
model:
  slot_gain_lambda: 100.0
  slot_gain_target: 0.9
  slot_gain_eps: 0.02
wandb:
  name: to-mnext-y2
