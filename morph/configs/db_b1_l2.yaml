# DiffusionBlocks arm DB-B1-L2 — recurrent-depth B=1, FAITHFUL Option-A objective,
# cheap x0_inject conditioning. The Phase-1 pathfinder arm (checklist §15).
#
# Objective: L2 in EMBEDDING space (App. B/C) with a CE anchor. The first db_b1_l2 run
# (buggy, RESULT.md) produced token salad: two causes, both fixed here.
#   Finding 1 (BUG): the L2 target was NOT detached, so the loss trained the tied embedding
#     by moving TARGETS toward predictions → directional collapse. Now db_setup detaches
#     the target ALWAYS. With a detached target the embedding is untrained by L2, so:
#   ce_anchor_lambda>0 adds a Diffusion-LM rounding term λ·CE(D̂ @ E.T, labels) (fused, no
#     [N,V]) — keeps rows separable AND supplies the high-σ next-token signal.
#   Finding 2 (σ mismatch): the paper's p_mean=-1.2 put 84% of mass below σ=1 and only 5.7%
#     above σ=2, starving the high-σ regime that AR generation (starts at σ_max·ε) lives in.
#     p_mean=0.0/p_std=1.6 moves training mass toward it (median σ 0.30→1.0, P(σ>2) 5.7%→~33%).
# loss_weighting=edm is still correct for the L2 term (w(σ)=1/c_out² is derived for it).
#
# Conditioning: x0_inject (ONE sequence, clean embedding injected via ChannelInject) —
# the cheap path. The objective fix must prove itself HERE before any concat/two-source
# machinery re-enters (checklist §3 last item / §15 Phase 1).
#
# Gates (pre-registered, checklist §10): matched-vs-scrambled L2 at HIGH σ must show
# clear context use; bridge (MAUVE + gen-PPL) within 15% of the A0 row at equal tokens.
#
# Batch 14 / seq 1024 — MATCHED to the campaign (tul_short) so per-step curves compare
# directly to db_b1_concat and A0. Do not change the batch for comparability.
#
# MEMORY (MEASURED via ignore/db-b1-l2-run/vram_probe.sh, batch 14): the recurrent-depth
# no-BPTT win IS realized in LIVE memory. The x0_inject checkpoint (ckpt_grad_iters=-1)
# works under compile: fwd+bwd ALLOCATED peak = 10.17 GB compiled / 10.22 GB eager; WITHOUT
# the checkpoint it OOMs (>31 GB) in both. So checkpointing is load-bearing and correct —
# do NOT "fix" it. The ~26 GB people see is RESERVED memory (nvidia-smi/process reports
# reserved), ~20 GB under compile vs 10 GB live — Inductor workspace + dynamic-batch core-MLP
# variants, NOT retained activations. Keep expandable_segments=True (drops reserved 26→20 GB).
# The HC Cayley n=4 carrier is 4× wide.
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name db_b1_l2
defaults:
  - tul_short
  - _self_

wandb:
  name: db-b1-l2-fix   # detach + CE anchor + σ-reshape; distinct from the buggy db-b1-l2

training:
  steps: 2000          # pathfinder: enough to separate context use from autoencoding
  eval_every: 250

db:
  activate_at: 0.0     # from step 0 — no schedule transition to confound the arm
  mode: b1
  conditioning: x0_inject
  loss_kind: l2        # Option A — the paper's AR objective (embedding-space L2)
  loss_weighting: edm  # correct for L2 (derived for it); NEVER pair edm with loss_kind=ce
  ce_anchor_lambda: 1.0  # Finding 1 fix: Diffusion-LM rounding anchor on the detached target
  p_mean: 0.0          # Finding 2 fix: shift σ mass to high σ (median 0.30 → 1.0)
  p_std: 1.6
