# DiffusionBlocks arm DB-1 — recurrent-depth mode, B=1 (sheet §3.2, plan D2).
#
# THE FIRST ARM TO RUN. The whole 4:6:4 net is ONE denoiser: sample sigma, one forward
# pass, predict the clean next-token embedding. This is the setting the paper validated on
# Huginn (§5.5 / App. E.5), MORPH's closest published relative, and it carries none of the
# per-block schedule-stretch hazards that B=3 does.
#
# It isolates exactly one question: does the diffusion objective work on MORPH at all?
#
# Pre-registered (sheet §4.2, do NOT edit after this arm starts):
#   flop_proxy 14.0 (x0_inject) | s/step 0.62-0.80 | tok/s 18k-23k | peak 14-19 GB
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name db_b1
defaults:
  - tul_short
  - _self_

wandb:
  name: db-b1

db:
  activate_at: 0.0        # from step 0 — no schedule transition to confound the arm
  mode: b1
  conditioning: x0_inject
