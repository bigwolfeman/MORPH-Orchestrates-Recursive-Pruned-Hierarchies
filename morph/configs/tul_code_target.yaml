# LCTUL, the code TARGET arm "tul-code-target" (2026-09-17; docs/tul-code-spec.md §17;
# note .agents/notes/proposed/architecture/2026-09-17-lctul-target-slot-loop.md; prereg
# lab/experiments/planned/2026-09-17-lctul-target-slot-loop.md).
#
# LaDiR with the TUL SLOT LOOP as the latent generator. Resume the VAE stage's checkpoint
# (`tul-code-vae/step_10000.pt`: E + coda trained on truth codes at noise 3.0, rms-renormed)
# with E, the prelude, the embeddings AND THE CODA frozen; the ordinary strict slot loop runs
# and its exit state, through `TULCodeProj`, IS the M = prefix_k cells the coda reads. The
# loss regresses those cells onto E's code of the true next span (2 (1 - cos) per cell);
# the coda reads them with stop-gradient (`code_target_detach: true`, LaDiR's decoder never
# trains on a generated latent), so the loop learns from the regression ALONE. The
# checkpoint's flow thinker (velocity head, time embedding, cell markers) is dropped at load,
# loudly (train.py::drop_code_thinker_keys). The VAE's `core.*` never trained (phase 2 never
# came), so the slot loop's core starts from that checkpoint's init.
#
# ONE factor against `slot-spandec-strict` (`tul_slot_spandec_strict.yaml`): the write into
# the coda is a projection regressed onto a frozen code instead of `W_prefix`, and the coda
# and prelude are the frozen VAE stage's. The span decoder is OFF (the frozen coda is the
# mouth). The slot-loop gain constraint is ON as in base.yaml.
#
# THIS ARM BREAKS THE STANDING RULE "never regress onto the slot state" (root CLAUDE.md), on
# Wolfe's 2026-09-17 direction: "we can train TUL latent to match oracle".
#
# THE OPENING (2026-09-17, after the first draw aborted at step 10020): `training.init_from`,
# not `resume` — weights only, the step axis restarts at 0, so the loop's core (at init in
# the VAE checkpoint: phase 2 never came) gets the measured 1000-step LR ramp and a fresh
# optimizer, exactly the opening every panel arm gets; `data_skip_batches: 10000` moves the
# stream past the batches the VAE stage already read. The trainer's divergence guard is
# lifted to 1e5 ppl: the frozen strict coda's CE on the predicted cell is the arm's
# INSTRUMENT (7.4 nats = the cell carries nothing, 4.4 = ruler, 1.3 = oracle), and the
# default 1000-ppl ceiling (6.9 nats) sits inside that range — it killed the first draw
# at the resume step. The detonation tripwire (preclip/total) is untouched.
#   training.init_from=/home/wolfe/morph-to/checkpoints/morph/tul-code-vae/step_10000.pt
defaults:
  - tul_slot_spandec_strict
  - _self_
training:
  steps: 20000
  ckpt_every: 5000
  ademamix_t_beta3: 20000
  data_skip_batches: 10000
  # 2026-09-17 15:30: 1e8 (18.4 nats), was 1e5. On the detach arm the coda's CE on the
  # predicted cell trains nothing and is the arm's INSTRUMENT (7.4 nats = nothing, 1.3 =
  # oracle); arm A took one per-step strike at 11.5 nats (step 5360) while its regression
  # loss fell. A second consecutive strike would abort a healthy run. Non-finite loss is
  # still caught by the separate NaN/Inf abort.
  div_ppl_ceiling: 100000000
  train_only:                     # the slot loop and its write, nothing else
    - core.                       # the loop body (model 4:6x6:4 -> core injections 4..9)
    - x0_injects.4.
    - x0_injects.5.
    - x0_injects.6.
    - x0_injects.7.
    - x0_injects.8.
    - x0_injects.9.
    - injection.
    - tul.E_slot                  # the slot seed path (the loop's input)
    - tul.E_mask
    - tul.W_sent
    - tul_code_proj.              # the ONE write into the frozen coda
model:
  slot_gain_lambda: 100.0         # the slot-loop gain constraint (base.yaml)
  slot_gain_target: 0.9
  slot_cot_clip: 4.0
tul:
  spandec: false
  code_target: true
  code_target_weight: 1.0
  code_target_detach: true
  token_state_dropout: 0.0        # the coda is frozen; read it clean
wandb:
  name: tul-code-target
