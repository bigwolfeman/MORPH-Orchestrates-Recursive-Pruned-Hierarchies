# TUL arm TG4b — boundary-token slot seed (docs/tul-tg-spec.md context;
# lab/divergence/TG-WORKLIST.md A1). Built on top of tul_tg2 (restriction ON,
# plast_weight/emit_weight 0 — our best arm to date).
#
# THE DISCRIMINATOR IS ce_main VS THE CONTROL BAND (4.4586-4.5459 at step 3000)
# AND PLAN/LOOP WORTH ON ce_main — cite lab/experiments/failures/2026-08-27-tg-restriction.md.
# Do NOT claim an expected direction.
#
# WHY: same pooling-law argument as TG4a (see tul_tg4a.yaml), but instead of
# dropping the span signal entirely this arm replaces the bag-mean with a
# projection of the span's LAST token: `E_slot + W_sent . embed(t_last)`
# (morph/model/tul.py `TULSlots.slot_input`, `tul.slot_seed: boundary`). This is a
# SEED-LEVEL approximation of Thought Gestalt's mid-layer tap (arXiv 2512.25026's
# m_t = W_sent . H^(l_s)_{i_EOS}) — it reads the raw token embedding, not a
# mid-prelude hidden state, so it is NOT the faithful TG tap. Builds one new
# bias-free `nn.Linear(d, d)` (`TULSlots.W_sent`), so this arm's base weights are
# NOT byte-identical to TG4a's / tg2's at the same seed (see TULSlots docstring).
defaults:
  - tul_tg2
  - _self_

tul:
  slot_seed: boundary

wandb:
  name: tul-tg4b
