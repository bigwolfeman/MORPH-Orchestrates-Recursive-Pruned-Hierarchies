# CONTROL ARM for the math-pre-pretraining experiment — fresh RANDOM-init d512, identical
# blend + recipe to prepretrain_math_d512.yaml. SINGLE VARIABLE: the ONLY difference vs the
# math-seed run is training.init_from (here: null → fresh random init). Everything else — arch,
# quant stack, optimizer, LR schedule, TST, blend weights, steps, seed — is byte-identical so
# "does math pre-pretraining help?" is answered by (math-seed-final) vs (control-final).
#
# Launch (from MORPH repo, olympiad venv on PYTHONPATH for generators):
#   env -C <MORPH> OLYMPIAD_REPO=/mnt/sda1/Projects/00NN/Olympiad-AI PYTHONPATH=<MORPH> \
#     PYTHONUNBUFFERED=1 WANDB_MODE=online /home/wolfe/.venv/bin/python -m morph.training.train \
#     --config-name control_fresh_init_d512
defaults:
  - base
  - _self_

model:
  d_model: 512
  n_heads: 4
  n_kv_heads: 4
  d_ff: 1376
  vocab_size: 49169
  n_prelude: 4
  n_core: 0
  n_coda: 4
  mean_depth: 1
  max_depth: 1
  bptt_depth: 1
  ckpt_grad_iters: -1
  channel_dims: [256, 160, 96]
  compression: 2
  csa_compress_ratio: 8
  hca_compress_ratio: 256
  top_k: 256
  window_size: 256
  context_len: 512
  max_seq_len: 512
  lorentz_fraction: 0.25
  bigram_hash_vocab: 0
  n_ve: 3
  ce_chunk_size: 8192
  use_kernels: true
  hc_streams: 4
  hc_tau: 1.0
  hc_cayley_iters: 3
  hc_cayley_alpha: 0.1
  hc_init_gain: 0.1
  hc_use_kernel: true
  retention: true
  retention_layers: [1]
  retention_heads: 4
  retention_chunk: 128
  retention_gate_init: -6.0
  retention_carry: true
  retention_gate_bias: 2.0
  core_gain_clip: 0.0

training:
  init_from: null                 # ← THE ONLY DIFFERENCE: fresh random init (no math seed)
  ternary: true
  ternary_scope: backbone
  ternary_scale_group: tensor
  embed_quant: "int6"
  attn_proj_quant: "off"
  adam8bit: false
  bf16: true
  compile: false
  compile_mode: default
  dropout: 0.0
  prune_start: 999999999          # prune OFF
  compact_step: 999999999         # carve OFF
  cms_score_mode: grad
  steps: 46000
  lr_decay_steps: 610352          # 20B-tok cosine horizon (LR stays ~peak) — same as math run
  tst_bag_size: 6
  tst_ratio: 0.3
  optimizer: ademamix_b1zero
  lr: 3.0e-4
  lr_schedule: cosine
  min_lr: 3.0e-5
  warmup: 1000
  grad_clip: 1.0
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eval_every: 500
  n_eval_batches: 20
  ckpt_every: 4000
  gen_every: 0
  seed: 0                          # same seed ⇒ matched data order / TST masks

routing:
  route_start: 999999999          # ReMoE OFF

curriculum:
  enabled: true
  pretok_dir: ${oc.env:OLYMPIAD_REPO,/mnt/sda1/Projects/00NN/Olympiad-AI}/data/pretrain_mix
  allowed_source_roles: [pretrain_bulk, reasoning_midtrain, posttrain_gold]
  eff_batch: 64
  blend:
    olympiad_math: 0.20
    fineweb_edu: 0.30
    finemath: 0.25
    mathpile_textbooks: 0.15
    qa_stackexchange: 0.10
  stages:
    - {seq_len: 512, context_len: 512, micro_batch: 32, steps: 46000}

data:
  dataset: /home/wolfe/.cache/huggingface/datasets/openwebtext/**/openwebtext-train-*.arrow
  tokenizer: bigcode/starcoder2-7b
  seq_len: 512

wandb:
  project: MORPH-Math
  name: control-fresh-init-d512
  tags: [morph-seed, control, fresh-init, nlp, tst, d512, ademamix]
