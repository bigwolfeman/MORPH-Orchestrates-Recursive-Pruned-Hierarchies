# Slot-loop panel, arm "slot-spandec-mask": the mask ruler with the M-next MUX REPLACED by
# a span decoder. One factor against `slot-mux-mask-norm-match` — the slot's TARGET.
#
# THE PROBLEM THIS ARM IS. The MUX loss reads z once through the tied head and scores it
# against the geometric superposition of the next span's tokens (`mux_span_targets`, rho
# 0.9). That target is ORDER-FREE: one categorical distribution, so the best z is the
# span's weighted unigram marginal. Wolfe, 2026-09-11: "M-next asks for the next span's
# first token through the tied head; this is probably 99 % of our problem. We need the
# whole span to decode from z, and we are essentially getting like 2 tokens out of it."
#
# WHAT THE BUDGET SAYS THE SLOT HAS TO CARRY (lab/experiments/failures/
# 2026-09-11-arc-span-budget.md, measured the same day): 0.3994 nats [0.3838, 0.4162] of
# cross-span information at 5k, and it is NOT front-loaded — a FLAT 0.315 at every offset
# eight or more tokens into a span, plus a 0.958 spike at the span's first position. The
# mask arm's prefix write is worth 0.093 of it, with the front-loaded decay shape. A
# marginal can buy the spike. Only a conditional decoder can be asked for the flat part.
#
# THE TARGET. `tul.spandec` runs a small causal decoder over [z, t_0 .. t_{J-2}] and
# charges -log p(t_j | z, t_{<j}) at EVERY token t_j of the next span, J = tul.span_cap
# (32). The gradient reaches z from every token of the span instead of once per span, and
# there is a token path (never decode a span from one vector plus an offset — Huginn
# 2026-08-16, MegaByte T7, Bowman T2, Hourglass T6). Code and contracts:
# morph/model/tul_spandec.py.
#
# COST, in block-passes per token, arithmetic not a guess (row = 1024 real tokens,
# L_total 1152, 64 slot cells, ~51 of them valid, mean depth 6):
#   prelude 4 x 1152 + core 6 x 51 x 6 + coda 4 x 1152  = 11052 -> 10.8 / token
#   span decoder 2 x 64 x 32                            =  4096 ->  4.0 / token
# so the arm is 14.8 against the ruler's 10.8 (+37 %) and the PLAIN panel's 44. The
# decoder's parameters are not in the token-CE path at all — they only shape z — so a CE
# move is not a capacity reading, but the wall clock is a real cost and is reported.
#
# THE TIED HEAD. `mux_detach_head: true`, which the ruler lineage (tul_gl1b) sets FALSE.
# This is not a second factor against the ruler here: `mux_beta: 0` removes the MUX, so on
# this arm the knob governs the span decoder ALONE. The reason to flip it: the decoder puts
# ~J times the MUX's gradient on the weight-tied table, the one measured failure of an
# undetached auxiliary head on this tree is a divergence at step 2800
# (lab/experiments/failures/2026-08-25-mux-head-arm-v1a.md), and the decoder's INPUT
# embedding read is detached unconditionally for the same reason. `slot-spandec-mnext-mask`
# carries the same setting, so its one-factor partner is THIS arm, not the ruler.
#
# Record: lab/experiments/successes/2026-09-11-arc-span-decoder.md
# Note: .agents/notes/proposed/architecture/2026-09-11-span-decoder-target.md
defaults:
  - tul_slot_mux_mask_norm_match
  - _self_

tul:
  mux_beta: 0.0                 # the M-next MUX is REPLACED, not supplemented
  mux_detach_head: true         # governs the span decoder alone at mux_beta 0 (above)
  spandec: true
  spandec_layers: 2
  spandec_weight: 1.0
  spandec_max_tokens: 0         # 0 -> tul.span_cap (32), the whole span

wandb:
  name: slot-spandec-mask
