# TUL arm TAX85 — raise the Bowman token-state dropout on the coda input.
# Pre-registration: lab/experiments/planned/2026-08-27-token-tax-headroom.md
#
# ONE change from tul_a1: tul.token_state_dropout 0.15 -> 0.85. p is the
# probability a TOKEN coda input is DROPPED (replaced with E_mask), NOT kept —
# see morph/model/tul.py::apply_token_dropout, `drop = (rand < p) & ~slot_mask`.
# A heavy tax: 85 % of non-slot positions lose their own coda input and must be
# reconstructed from the slot plan and neighbouring tokens through attention.
#
# Why the arm exists: the objective split refuted credit assignment as the root
# (the coda's gradient into the core is orthogonal to the slot's own target and
# 82 % of its size). So headroom binds, and it can be missing two ways — the
# plan holds content the coda declines to use, or it holds nothing.
#
# THE DISCRIMINATOR IS LOOP WORTH, NOT THE LOSS. CE degrades with p in BOTH
# cases, so reading the loss cannot separate them. Plan worth alone is also
# wrong: it includes the span bag-mean, which the slot carries without looping
# at all. Predictions T2/T3 in the pre-registration. T5 is a health gate that
# scores first, because BROKEN runs score HIGH on plan worth by construction
# (measured: 0.0247 at ppl 305, 0.0301 at ppl 603).
defaults:
  - tul_a1
  - _self_

tul:
  token_state_dropout: 0.85

wandb:
  name: tul-tax85
