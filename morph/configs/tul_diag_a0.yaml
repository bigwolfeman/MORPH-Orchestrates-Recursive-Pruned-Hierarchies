# Diagnostic family built on arm A0 — the CONTROL that contains no TUL code.
#
# docs/tul-divergence-rca.md §5 candidate 1: the looped core may be unstable on a
# short sequence, independent of TUL. A0 at seq_len 64 tests that with the plain
# model. If its core gradient explodes too, the divergence is a MORPH property and
# TUL is exonerated.
#
# Hold tokens/step constant when shortening the sequence — batch 224 × 64 = 14336,
# exactly A0's 14 × 1024. Otherwise the shorter arm also has 16× the gradient noise
# and the grad-norm comparison measures batch size, not sequence length.
#
# Run (name each run, the frozen config records the rest):
#   python -m morph.training.train --config-name tul_diag_a0 wandb.name=D0-a0-s1024
#   python -m morph.training.train --config-name tul_diag_a0 wandb.name=D1-a0-s64 \
#       data.seq_len=64 training.batch_size=224
defaults:
  - tul_a0
  - _tul_diag_short
  - _self_

wandb:
  name: null      # set per run on the command line — a diagnostic arm must be named
