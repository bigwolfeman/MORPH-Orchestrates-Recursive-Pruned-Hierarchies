# ARM FM1-CW — FM1 under the compaction window (docs/tul-compaction-window-spec.md).
#
# FM1 (run h4s01ngk) proved the plan can identify the next span at top-1 ~0.70 while
# the coda pays exactly ZERO nats for it: token CE is fully satisfied by the token
# context while the tokens are still in the sequence. This arm deletes the cheap
# channel instead of taxing it: the coda sees only the last (1024 - 576) = 448 token
# positions plus every slot. Content before the cut has no path to the loss except
# through a plan.
#
# tul.coda_token_cut=576 is the value the 2026-08-18 eval screen ran (CW0 > CW1 >
# CW2 > CW3, CW1-CW2 CI excludes 0). 448 scored tokens per row keeps the CE signal
# alive at 4500 steps; the literal "last 2 spans" cut (~984) starves it.
#
# val/ce_tokens under this arm is CE over tokens >= 576 ONLY — NOT comparable to
# A3/FM1 numbers. The within-run ablations (val/plan_worth_zero, val/plan_worth_shuffle,
# val/copy_gap) are the metrics; the pre-registration is
# lab/experiments/planned/2026-08-28-tul-fm1-cw.md.
#
# Decision record: .agents/notes/proposed/architecture/2026-08-28-fm-reader-bottleneck-cw.md
defaults:
  - tul_fm1
  - _self_

tul:
  coda_token_cut: 576

wandb:
  name: fm1-cw
