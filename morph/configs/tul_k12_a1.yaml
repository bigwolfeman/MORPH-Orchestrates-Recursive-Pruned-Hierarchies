# ARC E12, the k=12 panel: A1 classic (bag-mean seed, emit/plast 0.5/0.5, no MUX, no
# mask) under today's recipe (the panel pins, the gain hinge and base.yaml's fixed-point
# term) at a FIXED slot depth of 12. The original design, given the depth.
# Prereg: lab/experiments/planned/2026-09-07-arc-e12-k12-panel.md
defaults:
  - tul_to_a1
  - _self_

model:
  bptt_depth: 12                 # full BPTT through all 12 (Y2: 8 = full at max 8)
tul:
  slot_depth_fixed: 12           # EVERY valid slot loops exactly 12 times, train and eval
  slot_max_depth: 12

wandb:
  name: k12-a1
