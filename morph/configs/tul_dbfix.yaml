# ARM DBFIX — the faithful DiffusionBlocks one-pass training step (pure db1).
#
# CLAUDE.md "faithful DiffusionBlocks" mission. `tul.db_loop` (arm L3) kept the
# T-iteration UNROLLED loop and only detached the carry between iterations; it built
# NO sigma/timestep conditioning, so every iteration got the identical job and
# specialised at nothing (measured depth-inertness). This arm is the paper's ACTUAL
# recipe instead (arXiv 2506.14202 App. B "recurrent-depth architectures"): every
# training step is ONE sigma-conditioned core application on a noised slot-seed state
# (morph/model/transformer.py::_tul_core_db1), never a loop — `step_mix: {db1: 1}`
# selects it on EVERY step. Eval automatically runs the deterministic Euler ladder
# (`_tul_core_db1_ladder`) because `core_stage_cond: sigma` is set.
#
# Defaults come from tul_l1 (the loop-restored, uncontrolled arm) WITHOUT db_loop —
# db_loop stays false (tul_l1's own default), so this arm and tul_l3 differ ONLY in
# how the T-iteration machinery is replaced (db_loop's detached unroll vs db1's true
# one-pass step), not in tg_restrict/mux/sigreg/n_core/bptt_depth.
defaults:
  - tul_l1
  - _self_

tul:
  core_stage_cond: sigma
  # EDM/DiffusionBlocks defaults (App. C, App. E) — left at the paper's own numbers;
  # see morph/model/tul.py TULConfig docstring for why they are TUL-local fields
  # rather than a reuse of morph/model/diffusion_blocks.py's module globals.
  db1_sigma_min: 0.002
  db1_sigma_max: 80.0
  db1_p_mean: -1.2
  db1_p_std: 1.2
  db1_sigma_data: 0.5
  db1_cond_dim: 256
  # 0 -> model.mean_depth (mission spec): the Euler ladder pays the SAME loop depth
  # its bptt sibling would have, with no separate knob to forget.
  db1_ladder_steps: 0

training:
  step_mix:
    db1: 1

wandb:
  name: tul-dbfix
