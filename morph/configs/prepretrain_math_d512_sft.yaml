# SFT for the math-pre-pretraining experiment — light instruction-tune (~1k steps) of the
# d512 continue-pretrain checkpoint on Dolly (general instruction) + ARC-MCQ mix, so the
# model is instruction-followable for the general benchmarks (GSM8K / ARC).
#
# Model block MUST match the pretrain build (prepretrain_math_d512.yaml) EXACTLY, else
# load_checkpoint sees unexpected/missing keys and RAISES. dropout=0.0 is load-critical:
# the ckpt was built at dropout 0 (bare `mlp.` keys); sft.yaml's default 0.1 would build
# `_KwargSequential` (`mlp.0.…`) and mismatch. Quant stack (ternary backbone + int6 embed)
# also mirrors pretrain.
#
# Launch (from MORPH repo, olympiad venv on PYTHONPATH for tokenizer/vocab):
#   env -C <MORPH> OLYMPIAD_REPO=/mnt/sda1/Projects/00NN/Olympiad-AI PYTHONPATH=<MORPH> \
#     PYTHONUNBUFFERED=1 /home/wolfe/.venv/bin/python -m morph.training.sft \
#     --config-name prepretrain_math_d512_sft \
#     sft.init_ckpt=<MORPH>/checkpoints/morph/prepretrain-math-d512/step_46000.pt \
#     wandb.name=sft-prepretrain-math-d512
defaults:
  - base
  - _self_

model:
  d_model: 512
  n_heads: 4
  n_kv_heads: 4
  d_ff: 1376
  vocab_size: 49169
  n_prelude: 4
  n_core: 0
  n_coda: 4
  mean_depth: 1
  max_depth: 1
  bptt_depth: 1
  ckpt_grad_iters: -1
  channel_dims: [256, 160, 96]
  compression: 2
  csa_compress_ratio: 8
  hca_compress_ratio: 256
  top_k: 256
  window_size: 256
  context_len: 512
  max_seq_len: 512
  lorentz_fraction: 0.25
  bigram_hash_vocab: 0
  n_ve: 3
  ce_chunk_size: 8192
  use_kernels: true
  hc_streams: 4
  hc_tau: 1.0
  hc_cayley_iters: 3
  hc_cayley_alpha: 0.1
  hc_init_gain: 0.1
  hc_use_kernel: true
  retention: true
  retention_layers: [1]
  retention_heads: 4
  retention_chunk: 128
  retention_gate_init: -6.0
  retention_carry: true
  retention_gate_bias: 2.0
  core_gain_clip: 0.0

training:
  # Quant stack MUST equal pretrain so the saved parametrizations load.
  ternary: true
  ternary_scope: backbone
  ternary_scale_group: tensor
  embed_quant: "int6"
  attn_proj_quant: "off"
  adam8bit: true            # SFT optimizer = adamw8bit (sft.yaml recipe); avoids AdEMAMix confounds
  bf16: true
  compile: false
  dropout: 0.0             # LOAD-CRITICAL: ckpt built at dropout 0 (bare `mlp.` keys)
  prune_start: 999999999   # frozen topology
  compact_step: 999999999
  lr: 2.0e-5               # low SFT LR — imprint format without catastrophic forgetting
  optimizer: adamw
  grad_clip: 1.0
  weight_decay: 0.0
  # (steps/warmup/schedule here are unused by sft.py — it derives total_steps from the data
  #  and builds its own warmup+cosine via make_lr_schedule.)

routing:
  route_start: 999999999   # ReMoE off

sft:
  packing: true
  init_ckpt: ???           # REQUIRED on CLI (the step_46000.pt pretrain ckpt)
  # ~1k steps SINGLE epoch (every example seen exactly once → no memorization). MEASURED via
  # CPU dry-run: full Dolly (14703 usable after >1024 drop) + 3370 ARC-train MCQ = 18073 ex,
  # ~3.1M packed tokens / seq1024 = ~3030 windows / batch3 = ~1010 optimizer steps.
  n_examples: 15011        # entire databricks-dolly-15k (14703 survive the max_len filter)
  mcq_frac: 0.25           # interspersed ARC-train MCQ (general-knowledge instruction)
  mcq_n: 6000
  seq_len: 1024
  batch_size: 3            # b3 x 1 epoch ⇒ ~1010 steps (b4 gives 758; b2 gives 1516)
  epochs: 1
  warmup_frac: 0.05
  min_lr: 2.0e-5           # flat LR after warmup (sustains drive over ~1k steps)
  seed: 1234

wandb:
  project: MORPH-Math
  entity: adew-me
  name: sft-prepretrain-math-d512

hydra:
  job:
    chdir: false
  run:
    dir: ignore/hydra_sft/${now:%Y%m%d_%H%M%S}
