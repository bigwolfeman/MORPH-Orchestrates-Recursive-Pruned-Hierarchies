# Slot-loop panel, arm "slot-spandec-strict-codaspan32": the WHOLE-SPAN version of
# `slot-spandec-strict-codaspan`. ONE factor against it
# (`tul_slot_spandec_strict_codaspan.yaml`): `tul.coda_span_heads`, 8 -> 32.
#
# WHY BOTH. Wolfe's question has two halves: "perhaps the coda needing to spit out a lot
# of the span OR ALL THE SPAN at once changes the behavior." 32 is `tul.span_cap`, so at
# J = 32 the heads cover every token a packed span can hold and the coda's state at the
# emitting cell is asked for the span in full. 8 is where the measured cross-span budget
# stops being front-loaded (flat 0.315 nats at offset 8+,
# lab/experiments/failures/2026-09-11-arc-span-budget.md), so it is the cheap half of the
# question and the one expected to run.
#
# COST, and this is why it is a separate arm rather than the default. The readout goes to
# J x 64 = 2048 rows per row-batch member against the token CE's ~1024 — about TWICE the
# main CE's readout, paid every step. Still no extra block pass (32 x [d, d] matmuls on
# [B, S, d] is 13 GFLOP at the panel shape) and still ONE chunked
# `fused_linear_cross_entropy` call, so the [B*S*32, V] logits (2.4 GB fp32 at B 6, S 64,
# V 49169) are never materialised. The 12-step smoke's tok/s against the 8,086 floor
# decides it; of the two codaspan arms this is the one that can miss.
#
# The far heads are also the thin ones: a span shorter than 32 tokens masks every offset
# past its end, and the packed mean span is ~20 tokens, so heads 21..32 are supervised on
# a minority of slots. `tul/coda_span_n_tokens` is the column that says by how much, and
# it should be read before any comparison with J = 8's number.
#
# Record: lab/experiments/planned/2026-09-12-arc-objective-arms.md
# Note: .agents/notes/proposed/architecture/2026-09-12-objective-arms-per-pass-plan-and-parallel-coda.md
defaults:
  - tul_slot_spandec_strict_codaspan
  - _self_

tul:
  coda_span_heads: 32           # = tul.span_cap: the whole span, in parallel

wandb:
  name: slot-spandec-strict-codaspan32
