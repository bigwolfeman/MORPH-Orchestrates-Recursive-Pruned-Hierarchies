# R7 — cond4: R4 + a 4-layer NON-SHARED conditioning stack that runs ONCE over the slot
# sequence after the loop; z is its output; tokens keep the 4-layer coda. Same block
# parameter count as R8 (coda8): the pair asks where four layers pay — on ~50 slot
# positions (decode stays 8 layers/token) or on every token (12 layers/token).
# Wolfe's sketch, 2026-09-03: prelude → core loop → conditioning 4 layers → frozen z → coda.
defaults:
  - tul_to_mnext
  - _self_
tul:
  cond_layers: 4
wandb:
  name: to-cond4
