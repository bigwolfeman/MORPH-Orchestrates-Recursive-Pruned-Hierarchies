# TUL arm NTP-dropout — 10% of steps run slot-free (Wolfe's idea, 2026-08-27).
# Pre-registration: lab/experiments/planned/2026-08-27-warmup-sigreg-ntpdrop.md
# Design note: .agents/notes/proposed/feature/2026-08-27-ntp-dropout.md
# ONE change from tul_a1 (the control config): a tenth of steps take a batch
# from a SLOT-FREE loader and run `slot_layout=None`, the plain MORPH path.
# Wolfe's mechanism: an attractor pulls the coda toward solving the whole
# prediction itself and ignoring the loop; on slot-free steps the core must do
# legitimate token work, which should weaken it.
# The recorded RISK, which the design note argues and the criterion guards
# against: making the coda able to cope WITHOUT the plan can make the plan more
# decorative, not less. Scored on plan-off worth, not perplexity.
defaults:
  - tul_a1
  - _self_

training:
  ntp_dropout_p: 0.1

wandb:
  name: tul-ntpdrop
