# Slot-loop panel, arm "slot-register-m4-cond4": the Thought Register plus the 4-layer
# NON-SHARED conditioning stack, with the stack as the REGISTER'S reader.
# ONE factor against `slot-register-m4` (`tul_slot_register_m4.yaml`): `tul.cond_layers`.
# Same register, same M, same prefix width, same span-decoder target, same strict geometry.
#
# WHERE THE STACK SITS, and why it had to move. `_tul_core` returns the S*M compact CELL
# axis. Before this arm the stack ran AFTER the register's mean, so it would have read S
# means while the coda's 1:1 prefix write read the RAW M cells — the stack would have been
# the reader of neither of the register's two readers. It now runs on the cell axis
# straight out of the loop, under the SAME in-loop relation the register loops with (ONE
# builder, `transformer.slot_cell_relation`, shared with the core stage). So BOTH readers
# — the coda's per-cell write and the span decoder's mean — read the stack's output.
# At `slot_cells: 1` that placement is bit-identical to the old one: plain causal over S
# slots IS the relation at M = 1 and the register block is a no-op there.
#
# WHAT THAT RELATION IS, as executed. The mask ALLOWS cell i of slot k every cell of its
# OWN slot — LATER siblings included — and every cell of slots < k. That is a SUPERSET of
# flattened causal, and `tg_allow`/`tg_comp_allow` are ANDed into an already-causal
# relation and can only NARROW: through them the stack AND the register's own core stage
# executed plain FLATTENED CAUSAL, a cell never reading a later cell of its own slot.
# Measured and FIXED 2026-09-13, before this arm ran a single GPU step: the relation now
# travels as `tg_relation`, the one attention kwarg that REPLACES a branch's causal term,
# from the same builder on both stages. Pinned two-sided and numerically in
# tests/test_tul_cond4_strict.py (the stack's loss differs from a flattened-causal build,
# equals an all-true-within-slot build, and a cell 3 nudge moves cell 0 of the same slot)
# and in tests/test_tul_slot_register.py for the loop.
#
# WHAT IT TESTS. The information note
# (.agents/notes/proposed/architecture/2026-09-13-information-view-of-the-slot-loop.md)
# says a DETERMINISTIC map after the loop carries at most what the loop's exit carried
# (`Joint.mi_map_le`), so no stack can make the passes matter and the K-curve must stay
# flat. What the stack CAN move is the READER: four non-shared blocks with the register's
# own relation are the first mechanism in the arc that lets a span's four cells relate to
# each other OUTSIDE the weight-shared loop. If the register's cells stay apart
# (`val/slot_cell_eff_rank` above 2.0) but the K-curve is flat, this arm says whether the
# cells are worth anything to a reader that can mix them.
#
# COST. Four extra non-shared blocks over 64*4 = 256 compact cells run ONCE: 1,024
# block-passes per row, against the register core's 6 x 256 x 6 = 9,216 and the
# prelude+coda's 8 x 1280 = 10,240. Decode is unchanged at n_coda blocks per token.
# Parameters: exactly four coda blocks' worth on top of `slot-register-m4`. The stack's
# attention is EAGER here (the S*M relation tensors are eager-only, and `tg_relation`
# routes the window branch to the reference path unconditionally), the same second
# difference from the ruler the register's own core stage already carries.
#
# Record: lab/experiments/planned/2026-09-13-arc-cond4-reader.md
# Note: .agents/notes/proposed/architecture/2026-09-13-cond4-as-the-reader-of-the-register.md
defaults:
  - tul_slot_register_m4
  - _self_

tul:
  cond_layers: 4
  # The shipped setting: the coda's token CE trains THROUGH z, so the stack, the register
  # and the loop all learn from the reader as well as from the span decoder.
  detach_z: false

wandb:
  name: slot-register-m4-cond4
