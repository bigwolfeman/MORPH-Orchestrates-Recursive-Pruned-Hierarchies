# LoopMTP on the token loop, arm "norm-match-20k-d6-loopmtp" (arXiv 2608.03624). The
# fixed-depth-6 control (`notul_norm_match_20k_d6fixed`) with both of the paper's mechanisms
# on — the gated aggregator over all 6 iterates (Eq 9-11) and the soft MTP target (Eq 12-13)
# with iteration 1 left free. Its control is `notul_norm_match_20k_d6fixed`, NOT the Poisson
# top rung: LoopMTP needs a constant T.
# lambda_align 0.05: the paper sweeps 0.01 / 0.01 / 0.05 / 0.15 for T = 3 / 5 / 7 / 9 and
# gives no T = 6. 6 sits between the 0.01 and the 0.05 bracket; we take the larger, because
# the question this arm asks is whether horizon guidance differentiates the passes AT ALL
# and under-weighting the signal is the failure that would answer it wrongly. NOT swept.
# Record: lab/experiments/planned/2026-09-14-arc-loopmtp-token-loop.md
defaults:
  - notul_norm_match_20k_d6fixed
  - _self_

model:
  core_readout: gated
  loopmtp_weight: 0.05          # lambda_align, the T=7 value; see the header
  loopmtp_free_first: true
  loopmtp_proj: linear
  loopmtp_ponder_weight: 0.05   # lambda_ponder, the paper's default

wandb:
  name: norm-match-20k-d6-loopmtp
