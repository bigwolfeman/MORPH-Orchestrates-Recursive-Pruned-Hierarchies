# TUL arm A3 — shallow control (docs/tul-spec.md §7.1, ablation-ledger "TUL-A3").
# The COMPUTE FLOOR: no slots and no core at all, so the prelude and coda alone must
# carry the sequence (the n_core == 0 seed path, which routes prelude → input_norm →
# coda). A1 must clear this floor on val/plan_nats or the slot loop is doing nothing.
# Note this arm is NOT iso-parameter with A0/A1 — dropping the core removes its
# weights. That is inherent to a compute floor; report params/arm alongside the metric.
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name tul_a3
defaults:
  - tul_short
  - _self_

model:
  n_core: 0            # seed path: tokens go prelude → input_norm → coda

tul:
  activate_at: never   # no slots (A3 has none)

wandb:
  name: tul-a3
