# Slot-loop panel, arm "slot-spandec-norecur": `slot-spandec-mask` with the RECURRENCE
# removed and the parameters kept. The LRT control for the two energy arms.
#
# WHAT IT ISOLATES. Every slot-loop arm on this tree changes what the passes are asked for,
# what they see or how they are trained. None of them has asked the prior question: does the
# ITERATION buy anything at all, or is the slot cell's value entirely the extra parameters
# and the extra depth-1 map? `tul.slot_depth_fixed: 1` gives every valid slot EXACTLY one
# core application, train and eval, on the same weights, the same seed, the same target and
# the same reader. Parameter count, optimiser state and the span decoder are identical to
# the parent; only the number of applications changes.
#
# WHY `slot_depth_fixed` AND NOT A NEW KNOB. It already exists, it is already used by the
# k=12 panel and by every forced-depth probe, and it is the one expression of "this slot
# loops exactly k times" in the tree. A second way to say it would be a second thing to keep
# in step.
#
# HOW TO READ IT. The forced-depth sweep of an arm reports CE at depths 1..16, so a looped
# arm ALREADY reports its own depth-1 column. What this arm adds is a model TRAINED at depth
# 1: the difference between "a looped model evaluated at depth 1" and "a model trained at
# depth 1" is the thing the K-curve cannot see. If the two energy arms beat this control by
# less than they beat the ruler, the gain is the energy's parameters and not the loop.
#
# Record: lab/experiments/planned/2026-09-12-arc-latent-z-gradient.md
# ── AMENDMENT 2026-09-12 (Builder 2): THE CONTROL CHANGED ─────────────────────
# This arm now composes `tul_slot_spandec_strict` and not `tul_slot_spandec_mask`, and its
# wandb name gains the `strict` segment. Reason: on the mask geometry the slot CELLS carry
# the cross-span information the loop was supposed to carry — the whole slot channel is
# worth 0.182 nats on `slot-spandec-mask` at 5,000 while the loop's own prefix write is
# worth 0.078 — so an energy that conditions the loop's PASSES was being scored on a
# forward where the loop is bypassed. Under `tul.tg_geometry: strict` the loop is the only
# cross-span channel, which is the forward this arm's question is actually about.
# The one-factor partner is therefore `slot-spandec-strict`, NOT `slot-spandec-mask`.
# Strict geometry: .agents/notes/proposed/architecture/2026-09-12-strict-slot-geometry.md
#                  lab/experiments/planned/2026-09-12-arc-strict-geometry.md
defaults:
  - tul_slot_spandec_strict
  - _self_

tul:
  slot_depth_fixed: 1

wandb:
  name: slot-spandec-strict-norecur
