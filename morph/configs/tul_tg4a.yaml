# TUL arm TG4a — delete the bag-mean slot seed (docs/tul-tg-spec.md context;
# lab/divergence/TG-WORKLIST.md A1). Built on top of tul_tg2 (restriction ON,
# plast_weight/emit_weight 0 — our best arm to date).
#
# THE DISCRIMINATOR IS ce_main VS THE CONTROL BAND (4.4586-4.5459 at step 3000)
# AND PLAN/LOOP WORTH ON ce_main — cite lab/experiments/failures/2026-08-27-tg-restriction.md.
# Do NOT claim an expected direction.
#
# WHY: `pooling_probe` on tg2-s1@step_3500 confirms the plain-mean pooling law
# (slope -0.470, r2 0.922) — slot-seed signal falls from 0.516 (span 4-5) to 0.210
# (span 24-32) against a shared constant ||E_slot||=0.238. Under `tg_restrict` the
# slot already attends its whole span through all 4 prelude blocks, so the bag-mean
# is redundant AND diluting. ONE change from tul_tg2: `tul.slot_seed: e_slot` — the
# slot's token-embedding input becomes `E_slot` alone (morph/model/tul.py
# `TULSlots.slot_input`). No new parameters.
defaults:
  - tul_tg2
  - _self_

tul:
  slot_seed: e_slot

wandb:
  name: tul-tg4a
