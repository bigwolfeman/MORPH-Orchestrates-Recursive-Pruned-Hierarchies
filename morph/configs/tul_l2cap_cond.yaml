# ARM L2CAP-COND — L2 (spectral-projection-controlled full BPTT loop) + iteration
# conditioning.
#
# CLAUDE.md "faithful DiffusionBlocks" mission. Isolates the CONDITIONING mechanism
# from the training-shape change: tul_l2 is the measured-clean full-BPTT loop under
# the hard spectral projection (cap 1.5); this arm adds ONLY `core_stage_cond: iter`
# (morph/model/iter_cond.py) so every core-layer application gets an AdaLN-Zero
# signal for its iteration index, with NOTHING else different from L2 — no db1 step,
# no interleave, no change to bptt_depth/tg_restrict/mux/sigreg/spectral cap. If
# iteration conditioning alone changes L2's per-depth behaviour, that isolates the
# conditioning's effect from db1's one-pass training-shape change (tul_ilv50,
# tul_dbfix use the SAME conditioning machinery on top of the different shapes).
defaults:
  - tul_l2
  - _self_

tul:
  core_stage_cond: iter
  db1_cond_dim: 256

wandb:
  name: tul-l2cap-cond
