# Magnitude probe for SIGReg, NOT an arm. lambda is ~0 so the term is computed
# and logged (tul/sigreg) but cannot move the model: it exists only to read the
# statistic's scale on the real model before choosing a weight. Guessing the
# weight blind risks an auxiliary that dwarfs the LM objective, which is exactly
# how arm v1a failed.
defaults:
  - tul_a1
  - _self_

tul:
  sigreg_lambda: 1.0e-8
  sigreg_slices: 256

wandb:
  name: tul-sigreg-probe
