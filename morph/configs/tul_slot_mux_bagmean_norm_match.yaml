# Slot-loop panel, arm "slot-mux-bagmean-norm-match": the RULER with the SPEC's slot seed.
# `tul.slot_seed: bag_mean` on `tul_slot_mux_norm_match.yaml` and nothing else. One factor,
# and the factor is the slot's INPUT.
#
# What the two seeds are (morph/model/tul.py, `TULSlots.slot_input`):
#   boundary (the ruler, shipped in base.yaml since arm TG4b) = E_slot + W_sent . embed(t_last),
#            t_last the LAST token of the span. Builds a bias-free nn.Linear(d, d).
#   bag_mean (this arm, the spec's original seed, .agents/specs/tul-spec.md 3.2) = E_slot + mean_j
#            embed(t_j) over the span's tokens. Builds NOTHING new.
#
# Why this arm. Wolfe's 2026-09-10 reading of the geometry audit is that the slot's TARGET
# and the slot's INPUT/state capacity are the two levers left. The slot state is measured at
# effective rank 1.7-4.8 in 1024 dimensions on every checkpoint, and the static seed probe
# (lab/experiments/failures/2026-09-01-bound-seed-rank.md, 201 rows) says why: the shared
# E_slot vector dominates every seed's norm. That probe also ranked the two seeds this arm
# compares, and it ranked them AGAINST this arm's motivation:
#     ship (boundary)  rank_unit 1.58  rank_raw 1.30  mean pairwise cos 0.773
#     bag  (bag_mean)  rank_unit 1.13  rank_raw 1.14  mean pairwise cos 0.941
# bag_mean is the LOWER-rank, MORE collinear seed of the two. So this is not a capacity
# INCREASE dressed up as a control; it is the one-factor read of the seed the spec wrote,
# under the shipped ternary rule, on the ruler recipe, and the rank record predicts it moves
# the wrong way. It is queued because the seed axis has never been read under `norm_match`
# at all, and because the ONE measurement of a bag-family seed on a trained slot loop
# (`tul_w1`, `slot_seed: content` = bag_mean minus the E_slot term) read 0.13 nats BETTER
# absolute CE than the boundary seed while its depth earning FELL to the floor
# (lab/experiments/failures/2026-09-01-write-side-ladder.md: W1 K1-K6 +0.0007 and CE 4.3395
# against R0 boundary's +0.0113 and 4.4689). If that split reproduces here, "better CE" and
# "the loop earns" are separable by the seed alone, which is a result either way.
#
# Costs nothing and removes a parameter: bag_mean does not build `W_sent`, so this arm has
# 1024 x 1024 = 1.05 M FEWER parameters than the ruler. The TUL parameters are constructed
# LAST (runtime-invariants 6b, tests/test_tul_forward.py), so every non-TUL weight is still
# the ruler's at the same seed; the slot apparatus' own draws differ.
#
# Record: lab/experiments/planned/2026-09-10-arc-slot-mux-bagmean-norm-match.md
defaults:
  - tul_slot_mux_norm_match
  - _self_

tul:
  slot_seed: bag_mean

wandb:
  name: slot-mux-bagmean-norm-match
