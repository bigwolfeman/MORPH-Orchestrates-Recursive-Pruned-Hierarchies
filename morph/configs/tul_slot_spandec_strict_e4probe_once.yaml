# Map-cause intervention I-2, arm "lxtul-e4probe-once": the source enters at pass 0 only.
# Composes `tul_slot_spandec_strict_e4probe_map` (Stage 3 arm C: row target 0.98, tail
# hinge 100 @ 1.1) and changes ONE key plus the run name:
#
#   tul.slot_source_once  false -> true
#
# On passes t >= 1 the core step keeps DiagonalInjection's decay (h_ctx <- A * h_ctx) and
# drops the source: its dt * e term, the per-layer x0/bigram terms, and the LXTUL-E code
# (added after pass 0 only). So the entry and the code live in the state alone after pass
# 0, and the loop must KEEP them.
#
# WHY. The Lean account (lab/theory/tul_exploration/READ-BEFORE-TUNING-THE-LOOP-MAP-0.87-IS-
# THE-INJECTION-FLOOR.md, theorem 2) says a source re-supplied every pass lets the slot
# trajectory settle from its entry, and a settled trajectory cannot train the blocks'
# response. With the source gone the loop has something to keep. The account predicts A
# rises (mean >= 0.7), the map rises with it (>= 0.93), and still no depth value on the
# coda. The map guard (0.98) of the parent is what lets the map rise; e4probe's 0.9 hinge
# would fight it. Read against `lxtul-e4probe-map`. Prereg:
# lab/experiments/planned/2026-09-24-lxtul-map-cause.md.
defaults:
  - tul_slot_spandec_strict_e4probe_map
  - _self_

tul:
  slot_source_once: true

wandb:
  name: lxtul-e4probe-once
