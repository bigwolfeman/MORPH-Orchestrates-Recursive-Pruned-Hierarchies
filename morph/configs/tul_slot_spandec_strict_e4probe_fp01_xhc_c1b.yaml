# Plan C, arm C1b "lxtul-e4probe-fp01-xhc-c1b": C1 with the loop's scale pinned. C1 detonated at
# 3190 (C2 at 2711). The anatomy (probe.jsonl, 2026-09-26): the hinge's own reading
# `loss/gain_est` crossed its 0.98 target first (C1 ~2700, C2 ~1890) while the 16-stream
# carrier sat at ~500-800 per row; the hinge then fought at penalty 1-5 for ~400 steps; the
# carrier then grew by passes (ratio 1.3-1.5 per pass at 3000) and by one jump at pass 1
# (x10-16, row norm 800 -> 12,600); the detonating steps are the tail hinge reading per-slot
# gain 8-74 at that operating point. The N = 4 control (pk4) holds `gain_est` at 0.955-0.965
# under the same hinge. Composes `tul_slot_spandec_strict_e4probe_fp01_xhc` and changes:
#
#   model.slot_state_renorm  false -> true   every pass ends with each slot's 16-stream
#                                            carrier rescaled to the norm it entered the
#                                            loop with, direction kept (pads stay 0)
#   model.slot_gain_renorm   false -> true   the gain hinge (row 0.98 + tail 1.1) differences
#                                            that RENORMED map, the one the loop applies;
#                                            the raw step's reading goes to gain_est_raw
#
# Read: `loss/gain_est` (R(f)), `loss/gain_est_raw` (f), `loop/delta_ratio_t*` (the per-pass
# rotation; `loop/core_gain_t*` reads ~1.00 by construction), `preclip/total` against 1e4.
# The comparison to a1 (pk4) changes two things (xHC and the renorm): a C1b gap to a1 is not
# an xHC effect until a1 with the same two keys is run.
# Design: .agents/notes/proposed/architecture/2026-09-26-plan-c-xhc-slot-loop.md, "C1b".
defaults:
  - tul_slot_spandec_strict_e4probe_fp01_xhc
  - _self_

model:
  slot_state_renorm: true
  slot_gain_renorm: true

wandb:
  name: lxtul-e4probe-fp01-xhc-c1b
