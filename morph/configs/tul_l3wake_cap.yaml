# ARM L3-WAKE-CAP — the wake recipe WITH the contractivity control.
#
# Prereg: lab/experiments/planned/2026-08-30-tul-l3-wake-cap.md (frozen before the
# uncapped wake arm's depth sweep was read).
#
# Identical to tul_l3wake (DB init from tul-l3 step_4500, full BPTT, AdamW, fresh
# optimizer) plus the hard sigma<=1.5 projection — Wolfe: "the diffusionBlocks retrain
# probably should use l2cap." Separates "standard end-to-end training wakes the loop"
# (uncapped arm) from "the cap is the waking agent" (this arm).
defaults:
  - tul_l3wake
  - _self_

training:
  spectral_project_cap: 1.5

wandb:
  name: tul-l3wake-cap
