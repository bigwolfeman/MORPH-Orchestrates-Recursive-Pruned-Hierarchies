# The GL1 unmasked control as a NAMED config — mirrors the CLI override the twin ran
# with (tul.tg_restrict=false on tul_gl1). Exists so offline tools that take a config
# NAME (scripts/tul_samples.py) can load gl1-ctrl-s1 checkpoints; training uses the CLI
# override, and the two must stay equivalent.
defaults:
  - tul_gl1
  - _self_

tul:
  tg_restrict: false

wandb:
  name: tul-gl1-ctrl
