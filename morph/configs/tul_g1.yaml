# ARM G1 — GRT recurrence gate, NO cap: contractivity by architecture.
#
# Gate-ladder program (.agents/notes/proposed/architecture/2026-08-30-gate-ladder-program.md).
# tul_l1 (full BPTT, uncontrolled) + the Eq. 4-5 elementwise convex-blend gate
# (morph/model/recur_gate.py, arXiv 2608.15062 App. A defaults: bias +4, sigma_g 0.1,
# tau 1.0). If the gate alone keeps the loop trainable where L1's only protection was
# luck, contractivity-by-architecture works; compare G2 (gate + cap) to see whether the
# projection is redundant under a gate. The gate is STATE + PRELUDE keyed only — the
# cond-zero constraint (no iteration index in the training graph) holds by construction.
defaults:
  - tul_l1
  - _self_

tul:
  recur_gate: grt

wandb:
  name: tul-g1
