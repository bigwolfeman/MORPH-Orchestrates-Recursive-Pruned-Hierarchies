# Slot-loop panel, arm "slot-spandec-strict-fixed6": the CONTROL for
# `slot-spandec-strict-horizon` (`tul_slot_spandec_strict_horizon.yaml`). ONE factor
# against the ruler `slot-spandec-strict` (`tul_slot_spandec_strict.yaml`):
# `tul.slot_depth_fixed: 6`, with the horizon-passes objective and the gated readout
# BOTH off. Exists so the horizon arm's own two-factor difference against the ruler
# (fixed depth AND the new mechanism, at once) can be split: this config isolates
# "does merely FIXING the depth at the mean of the Poisson draw move anything", and the
# horizon arm is then read against THIS, not against the Poisson-depth ruler.
#
# Every per-pass reader the strict panel has already run (spandec_per_pass, oracle_z,
# the gate) works fine under a fixed depth too — `slot_depth_fixed` predates this arm —
# so this file changes nothing else about the strict-geometry recipe.
#
# Record: lab/experiments/planned/2026-09-14-arc-horizon-passes.md
# Note: .agents/notes/proposed/architecture/2026-09-14-horizon-indexed-passes.md
defaults:
  - tul_slot_spandec_strict
  - _self_

tul:
  slot_depth_fixed: 6

wandb:
  name: slot-spandec-strict-fixed6
