# LXTUL-G panel, arm "lxtul-g-d1": the depth-1-trained twin of `lxtul-g`. ONE factor
# against `lxtul-g` (`tul_slot_spandec_strict_gram.yaml`): `tul.slot_depth_fixed: 1` —
# every valid slot gets EXACTLY one core application and ONE Gaussian step, train and
# eval, on the same weights, seed, heads, KL and reader (the `tul_slot_spandec_norecur`
# precedent).
#
# WHAT IT ISOLATES. Whether the stochastic loop's value needs the passes: prereg P-7 reads
# lxtul-g's ce_iw@4 against this arm's ce_iw@4, and the depth x width corner of
# `lxtul_g_probe.py --depths 1,6` reads both models at depths {1, 6}. At depth 1 the KL is
# a single-pass KL, so the two arms' per-slot KL are not the same sum.
#
# Prereg: lab/experiments/failures/2026-09-23-lxtul-g-panel.md
# Note: .agents/notes/proposed/architecture/2026-09-23-lxtul-gram-stochastic-loop.md
defaults:
  - tul_slot_spandec_strict_gram
  - _self_

tul:
  slot_depth_fixed: 1

wandb:
  name: lxtul-g-d1
