# ARC E16 mixin (E15's, revised after the 2026-09-08 throughput audit) — the Olympiad-AI
# synthetic-math data for the loop-contribution panel. Composed AFTER an arm config
# (defaults: [<arm>, oly_data, _self_]): every sample is a question + numbered reasoning
# steps (one per line) + answer block, ≤ 512 tokens (stage11_13 shard: mean 180, max 363;
# 2_10 shard: mean 134, p95 275, 20 docs of 2.18M above 512 get carry-split). The TUL
# boundary rule cuts ONE SPAN PER STEP (mean 12 tokens, 10–14 spans per doc). Shards:
# docs/olympiad-interop.md; vocab 49169 is already base.yaml's. Validation is the
# corpus's own 3,230 held-out docs (`val_source` below), so `val/loss` is a MATH number;
# the per-band answer readout is the held-out sweep at every checkpoint.
curriculum:
  enabled: true
  # Validation: the two shards' eval_holdout.jsonl as one shard
  # (scripts/olympiad_holdout_shard.py; 3,230 docs, 457k tokens, bands 2–13, never in a
  # training shard; the loader refuses it in a blend). Rewound before every eval, so each
  # eval and each ARM scores the same ~27 % of it (20 batches × 12 rows × 512).
  val_source: holdout
  val_seed: 1
  # Five per-band VIEWS of the two Olympiad shards (scripts/olympiad_band_views.py: shared
  # tokens file, sliced doc index): b2_3 103M tok, b4_5 77M, b6_7 81M, b8_10 30M, b11_13 367M.
  pretok_dir: ${oc.env:OLYMPIAD_REPO,/mnt/sda1/Projects/00NN/Olympiad-AI}/data/olympiad_bands
  allowed_source_roles: [reasoning_midtrain]
  eff_batch: 24                  # micro_batch 12 × grad-accum 2 (12,288 tokens/step). Audit 2026-09-08:
                                 # micro 24 × 1 OOMs on every arm (27.0 GB); micro 12 × 2 with the
                                 # levers below is 11.6k tok/s at 22.7 GB on the mask arm
  blend:                         # LOADING weights (every source a stage names must be here);
    b2_3: 1.0                    # the per-stage `blend` below is what is drawn
    b4_5: 1.0
    b6_7: 1.0
    b8_10: 1.0
    b11_13: 1.0
  # The data curriculum (Wolfe 2026-09-07: "this has a curriculum system, start on 2.1"):
  # four stages at ONE length whose blends walk up the bands with ~15 % replay of the band
  # just left. Token fractions per stage; the loader draws docs ∝ weight / mean_len.
  stages:
    - {seq_len: 512, context_len: 512, micro_batch: 12, steps: 1500, blend: {b2_3: 0.70, b4_5: 0.30}}
    - {seq_len: 512, context_len: 512, micro_batch: 12, steps: 1500, blend: {b2_3: 0.15, b4_5: 0.45, b6_7: 0.40}}
    - {seq_len: 512, context_len: 512, micro_batch: 12, steps: 1500, blend: {b4_5: 0.15, b6_7: 0.35, b8_10: 0.50}}
    - {seq_len: 512, context_len: 512, micro_batch: 12, steps: 1500, blend: {b6_7: 0.15, b8_10: 0.35, b11_13: 0.50}}
data:
  seq_len: 512
model:
  # Audit 2026-09-08 (lab/perf/2026-09-08-oly-throughput-audit/): checkpoint only 4 of the
  # grad iterations instead of all of them. EXACT (step-0/1 loss bit-identical on all four
  # arms), 1.25x on the mask arm at +6.3 GB (22.7 GB peak); 0 would be +3 % for 2.1 GB more.
  ckpt_grad_iters: 4
training:
  steps: 6000                    # must equal the curriculum stage sum (4 × 1500)
  eval_every: 250                # 24 evals on the held-out math; ~28 s each on the mask arm
  ckpt_every: 1500               # a checkpoint at the end of every curriculum stage
  gen_every: 0
  grad_probe_every: 1            # the sustained tripwire reads preclip/total from probe.jsonl
wandb:
  project: morph-tul
