# LXTUL with 8 cells per slot instead of 4 (2026-10-04, Wolfe: "How about we try more cells?").
# One factor from lxtul.yaml: tul.fan_k 4 -> 8 (fan_mix: all needs prefix_k = fan_k, so
# prefix_k 4 -> 8 too). Tokens per row stay at seq_len; the packer adds prefix_k * max_slots
# cell positions on top (L_total 1280 -> 1536). 5000 steps, to pair with lxtul's 5k seeds.
# Prereg: lab/experiments/planned/2026-10-04-lxtul-eight-cells.md
defaults:
  - lxtul
  - _self_

model:
  ckpt_grad_iters: -1   # checkpoint every pass: 8 cells OOM at 4 (smoke 2026-10-04: 25.2 GiB at step 1). Exact.

tul:
  fan_k: 8
  prefix_k: 8

training:
  steps: 5000

wandb:
  name: lxtul-fan8
