# LXTUL + the output-only pointer / copy head (2026-10-06). One factor from lxtul.yaml:
# tul.pointer_heads 0 -> 4 (morph/model/tul_pointer.py). Each head attends from a token's final
# hidden state over earlier tokens' and reads the attention as a distribution over the token
# that followed; a gate mixes the heads with the model's head. Nothing enters a hidden state.
# Why: on the Parcae testbed, with a head on both sides, strict LXTUL's gap to plain fell from
# +0.294 to +0.045 at 5k with K1-K6 kept (parcae lxtul-testbed
# docs/experiments/failures/2026-10-06-parcae-pointer-cellkey.md).
defaults:
  - lxtul
  - _self_

tul:
  pointer_heads: 4

training:
  steps: 5000

wandb:
  name: lxtul-pointer
