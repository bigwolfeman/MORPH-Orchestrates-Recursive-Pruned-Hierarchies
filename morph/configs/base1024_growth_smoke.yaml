# Growth-compatible d1024 base: 150-step B4 x S4096 sustained-training smoke.
# This is a hardware/optimizer gate, not a quality run. It holds the initial
# full-run TST and AdEMAMix schedules steady while disabling phase transitions.
defaults:
  - base
  - _self_

model:
  d_model: 1024
  n_heads: 8
  n_kv_heads: 4
  n_layers: 14
  d_ff: 2816
  vocab_size: 49169
  max_seq_len: 4096
  n_prelude: 4
  n_core: 6
  n_coda: 4
  mean_depth: 6
  max_depth: 8
  bptt_depth: 4
  ckpt_grad_iters: -1
  channel_dims: [512, 320, 192]
  compression: 2
  csa_compress_ratio: 8
  hca_compress_ratio: 256
  top_k: 256
  window_size: 256
  context_len: 4096
  lorentz_fraction: 0.25
  bigram_hash_vocab: 49152
  n_ve: 0
  retention: true
  retention_layers: [1]
  retention_heads: 8
  retention_chunk: 256

training:
  steps: 150
  batch_size: 4
  seed: 20260710
  bf16: true
  compile: true
  compile_mode: default
  optimizer: ademamix_b1zero
  adam8bit: true
  # Preserve the production optimizer horizon instead of compressing it into
  # the 150-step smoke.
  ademamix_t_alpha: 8000
  ademamix_t_beta3: 100000
  tst_bag_size: 6
  tst_ratio: 1.0
  prune_start: 999999
  compact_step: 999999
  eval_every: 999999
  n_eval_batches: 1
  ckpt_every: 999999
  gen_every: 0
  gen_test: false

data:
  seq_len: 4096

wandb:
  project: morph
  name: base1024-growth-b4s4096-150step-smoke

hydra:
  job:
    chdir: false
