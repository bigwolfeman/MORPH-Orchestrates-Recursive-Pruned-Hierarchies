# Slot-loop panel, arm "slot-mux-mask-norm-match": the RULER in the strict geometry.
# `tul.tg_restrict: true` at scope "all" on `tul_slot_mux_norm_match.yaml` and nothing
# else. One factor against the ruler; one factor against
# `slot-mnext-staged-mask` (which is this arm plus `tul.mux_stage_own_iters: 3`).
#
# Why this arm exists. Every mask arm on this family before today read a token K1-K6
# between 0.020 and 0.060 (E4 `to-mnext-y2-mask` 0.0204; E13 `m12-mnext-mask` 0.033 /
# 0.049; E18 `mask-k2/k4/k8` 0.024 to 0.049), and all of them ran under the OLD ternary
# rule (`absmean`). Today's `slot-mnext-staged-mask` read 0.0033, with the mask's forced
# token dependence gone, but it changed TWO things against that record at once: the ternary
# rule (`norm_match`) and the loss (the staged own-span term at pass 3). This arm removes
# the loss change and leaves the rule, so the two causes separate. Filing that names the
# ambiguity in its own words: lab/experiments/failures/2026-09-10-arc-slot-mnext-staged-mask.md
# ("no plain-mask arm exists under norm_match, so whether the ternary rule or the loss
# removed it is one arm away (`tul_slot_mux_norm_match` + `tg_restrict`)").
#
# What this arm is a ONE-FACTOR test against, stated so nobody over-reads it. Clean pairs:
# the ruler `slot-mux-norm-match` (the mask, on or off) and `slot-mnext-staged-mask` (the
# staged own-span term, on or off). E4's `to-mnext-y2-mask.yaml` is the same family under
# the old rule but is NOT a one-factor partner: it ran fully eager (no
# `tg_scoped_kernels`), so it differs here by the ternary rule AND by the hinge's noise
# bias on the eager finite difference. Read E4's +0.0209 as a lineage number, not as a
# paired control.
#
# SCOPE. `tul.tg_restrict_scope` defaults to "all": the same span-or-slot mask applies in
# the PRELUDE and in the CODA, so neither composes across spans on its own and the slot is
# the only route from an earlier span to a later token. That is the geometry the toy
# study's question 4 is about (lab/toy_slot_loop/WRITEUP.md) and the geometry every mask
# arm in the record ran. Scope "coda" (the `slot-unpack-*` family) leaves the prelude
# global on purpose and is the wrong control here.
#
# KERNELS, copied from the mask arms since E16 and not a free choice. `tg_restrict` forces
# `model.use_kernels: false` at construction (the fused window/CSA/HCA kernels do not know
# about the restriction and a silent unmasked kernel path is forbidden), and that turns
# EVERY fused kernel off process-wide. `model.tg_scoped_kernels: true` is legal with scope
# "all": every TG-restricted branch stays eager BY CONSTRUCTION, because a prelude/coda
# window call always carries `tg_allow` and routes to the reference path, and the TG
# compressed branches are pure eager functions. It lets HC-Cayley, the CCA prologue
# and the core-region window run fused. Two reasons it is required here, not optional:
#   * rate. E4's fully-eager mask arm on this exact recipe (`to-mnext-y2-mask`, mean-6,
#     batch 6, seq 1024) read 9,168 tok/s at step 200 against the ruler's 12,429 and a rate
#     floor of 8,086. Today's scoped-kernel twin `slot-mnext-staged-mask` read 9,349.
#   * the hinge. The eager finite difference reads gain 0.94 +- 0.014 on a map whose true
#     gain is 0.87 (noise bias at `slot_gain_eps` 0.02), so a fully eager arm's hinge at
#     target 0.9 fires on noise while the ruler's, running fused, does not. Without this
#     flag the arm would differ from the ruler by the mask AND by whether the stability
#     constraint is active.
#     Audit: .agents/notes/proposed/bug-fix/2026-09-08-slot-gain-eps-noise-bias.md
#
# Side effect, named because it makes this arm a partial control for audit finding F1:
# under `tg_restrict` the pooled `GatedPoolCompressor` is NOT BUILT on any layer
# (`_CCAHCAAttention.__init__` sets `self.compressor = None` and returns), so the HCA
# compressed branch that reads exactly 0.000 at S = 64 on the ruler cannot exist here.
# `tul_slot_mux_hca_fix.yaml` is the arm that removes F1 alone.
#
# Known price: the mask costs 0.1-0.2 nats of CE on every panel that has run it.
#
# Record: lab/experiments/planned/2026-09-10-arc-slot-mux-mask-norm-match.md
defaults:
  - tul_slot_mux_norm_match
  - _self_

model:
  use_kernels: false
  tg_scoped_kernels: true

tul:
  tg_restrict: true
  tg_restrict_scope: all

wandb:
  name: slot-mux-mask-norm-match
