# DiscoTUL (phase-2 tracker D2a, 2026-10-10): the one-cell strict slot loop
# (tul_onecell_pointer.yaml) plus DiscoLoop re-embedding between passes (Fu et al. 2026,
# arXiv 2607.00341; morph/model/tul_disco.py). One factor against tul_onecell_pointer.
#
# At the INPUT of every pass t >= 1, each slot whose depth continues gets
#   alpha * RMSNorm( sum_v softmax(head(h) / tau)_v W[v] )
# read off the carried cell through the model's own token head (stream mean, lm_mixer,
# final_norm, tied table DETACHED, slot id masked). Nothing after a slot's last pass.
#
#   disco_bridge topk, k 128   the paper's LM form (top-128 approximation). `soft` is the
#                              paper's exact form, `hard` the argmax row with a top-k
#                              straight-through backward (the DiffusionBlocks lesson).
#   disco_tau 1.0              the head's own logits
#   disco_gate learned, bias 0 sigmoid(<w, Phi_n> + b), w = 0: alpha 0.5 at step 0, OPEN
#   disco_detach_table true    the tied table gets no gradient from the term
# Eager twin of discotul_fast.yaml (the fixed-weight readout builds from this file).
# Note: .agents/notes/proposed/architecture/2026-10-10-discotul.md
defaults:
  - tul_onecell_pointer
  - _self_

tul:
  disco: true
  disco_bridge: topk
  disco_topk: 128
  disco_tau: 1.0
  disco_gate: learned
  disco_gate_bias: 0.0
  disco_detach_table: true

wandb:
  name: discotul
