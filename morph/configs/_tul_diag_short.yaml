# Shared short-run overlay for the TUL divergence diagnostic (lab/tul/divergence-rca.md §5).
#
# Included by tul_diag_a0.yaml and tul_diag_a1.yaml so the two arm families cannot
# drift apart: one place defines "a 500-step gradient trace", both arms get it.
#
# The ONLY product of a run built on this file is a gradient trace —
# `train/grad_norm`, `train/clip_factor`, `gradnorm/<region>`. 500 steps is far too
# few to compare quality, and NO quality claim may be made from a run of this file.
# Checkpoints are off: a 2.4 GB write buys nothing when the output is a scalar trace.
training:
  steps: 500
  eval_every: 250
  n_eval_batches: 10
  ckpt_every: 999999999       # never — see header
  gen_every: 0                # generation is irrelevant to a gradient trace
  gen_test: false

wandb:
  project: morph-tul-diag
