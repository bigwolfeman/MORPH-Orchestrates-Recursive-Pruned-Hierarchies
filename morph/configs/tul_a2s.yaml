# tg_slot_mask through the active-set sort). ONE delta vs tul_a2: tg_restrict.
# use_kernels must fall back to false (tg_restrict validation); the runner adds
# +model.tg_scoped_kernels=true like every TG arm.
# Prereg: lab/experiments/planned/2026-09-02-a2s-restricted-paid-loop.md
defaults:
  - tul_a2
  - _self_

model:
  use_kernels: false

tul:
  tg_restrict: true

wandb:
  name: tul-a2s
