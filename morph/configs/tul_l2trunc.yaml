# ARM L2-TRUNC — l2cap with the production TRUNCATED BPTT window (depth 4).
#
# Prereg: lab/experiments/planned/2026-08-30-tul-l2-trunc.md.
#
# tul-l2-cap (full BPTT + hard sigma<=1.5) is the first load-bearing loop: 0.233 nats
# of depth-earned CE, span-wide plan carrier. The cloud/scale recipe assumes truncated
# BPTT (base.yaml bptt_depth 4). This arm asks whether the cap's win survives the
# truncation: identical to tul_l2 except bptt_depth 4 (< max_depth 8 -> the last 4
# iterations carry grad, earlier ones run no-grad).
defaults:
  - tul_l2
  - _self_

model:
  bptt_depth: 4

wandb:
  name: tul-l2trunc
