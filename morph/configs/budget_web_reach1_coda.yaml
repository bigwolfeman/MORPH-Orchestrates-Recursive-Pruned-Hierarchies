# Cross-span budget panel, arm "budget-web-reach1-coda": the EXACT previous-span arm.
# `budget_web_reach1.yaml`'s attention reach (`model.span_reach: 1`) applies at EVERY
# block, so the stack relays one span further back per attention layer — that arm reads
# MORE than the previous span (an UPPER bound on what the previous span is worth, a LOWER
# bound on what lies further back; measured on the leak test's fixture: two spans back
# moves end-to-end logits by ~0.87 there). This arm confines the
# wider relation to ONE non-looped block (`model.span_reach_layer`): every OTHER block —
# every prelude block, every core pass, every OTHER coda block — reads own-span-only
# (reach 0). A query at the reach block therefore reads the previous span's states as
# they enter THAT block, and those states were built under reach 0 the whole way up to
# there, so nothing from two spans back can have arrived: an exact one-hop read, not a
# relayed one. The conv/value-shift/bigram routes are UNCHANGED from plain "span" and
# from `budget_web_reach1.yaml`: they still cut at every boundary, at every block.
#
# The reach block is coda[0], global index 10, VERIFIED by composing this chain and
# reading `model.n_prelude` (4) + `model.n_core` (6) = 10 — the same formula
# `_back_region` uses for `gi` (`morph/model/transformer.py`), not assumed from
# CLAUDE.md's generic "4 prelude + 6 core + 4 coda" description. coda[0] is chosen
# because it is the FIRST block after the core loop: every core pass and every prelude
# block still ran at reach 0, so the coda's own states going into block 0 carry nothing
# but own-span content, and the ONE cross-boundary read happens right there.
#
# CE(span) - CE(reach1-coda) is the LOWER bound on the previous span's worth (one block
# reads it, no relay), and CE(reach1-coda) - CE(reachall) the UPPER bound on what lies
# further back; `budget_web_reach1.yaml` gives the other side of each bracket. Together
# they split the 0.40-nat cross-span budget of
# `lab/experiments/failures/2026-09-11-arc-span-budget.md`.
# Leak gate: tests/test_span_mask_leak.py.
# Record: lab/experiments/planned/2026-09-21-span-reach-split.md
defaults:
  - budget_root
  - _self_

model:
  span_mask: span
  span_reach: 1
  span_reach_layer: 10   # coda[0]: n_prelude(4) + n_core(6), verified by compose above

wandb:
  name: budget-web-reach1-coda
