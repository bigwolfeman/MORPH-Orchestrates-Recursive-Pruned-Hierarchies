# LXTUL-E Stage 2, arm "lxtul-e4probe": e4 with the parallel head trained as a PROBE.
# Composes `tul_slot_spandec_strict_e4` (read it and e1: the recipe, the code and the head
# live there) and changes ONE thing, `tul.spandec_parallel_detach: false -> true`, plus the
# run name.
#
# WHY. Stage 1 (lab/experiments/failures/2026-09-24-lxtul-e-stage1.md): width survives
# (e1 par - e4 par mix 0.114 nats) and the loop integrates the code (exit separation
# 0.27 -> 0.53 over depths 1..6), but the head's term also trains the loop. This arm asks
# whether the head's target is what SHAPES the loop's state, or whether the coda's
# 4-rollout mixture alone already puts the width the head reads into it. The probe's par CE
# against e4's, on the same tokens, is that difference.
#
# WHAT DIFFERS FROM e4, exactly (tests/test_tul_lxtul_e_stage2.py pins it): the head reads
# `_readout(h_slots).detach()`, so its term (still in the total loss, weight 1.0) trains
# the head's own tensors and sends no gradient to the loop, the codes, the front,
# `lm_mixer` / `final_norm` or the tied table. The loop is trained by the coda's mixture CE
# and the ruler's stability terms alone. The build, the head, the target and every logged
# `par_*` stat are e4's.
#
# Note: .agents/notes/proposed/architecture/2026-09-23-provable-loop-contribution.md
defaults:
  - tul_slot_spandec_strict_e4
  - _self_

tul:
  spandec_parallel_detach: true

wandb:
  name: lxtul-e4probe
