# TUL arm A1-noaux — the MISSING CELL of the 2x2.
#
# The span-specificity panel (2026-08-28) measured three of four cells:
#
#                        aux losses ON        aux losses OFF
#   restriction OFF      ctrlworth-s3 65.1%   *** THIS ARM ***
#   restriction ON       tg1-s1        3.0%   tg2/tg3b/cap64  0.1-0.6%
#
# Two questions ride on it, and both matter more than any further TG variant:
#
# 1. DOES THE RESTRICTION BUY ANYTHING AT ALL? TG2's one durable win was removing the
#    takeover (0 of 4 seeds, against a control that fires 3 of 4). But TG2 is
#    tul_tg1-based, so it changed the objective AND the mask together. If zeroing the aux
#    losses cures the takeover WITHOUT the restriction, the restriction is pure cost —
#    it charges 0.14-0.22 nats of ce_main and destroys the plan's span-specificity 20x
#    (65.1% -> 3.0% at matched aux losses) and returns nothing.
#
# 2. WHAT ACTUALLY CREATES SPAN-SPECIFIC CONTENT? Within the restricted family the aux
#    losses are worth ~10x of specificity (0.3% -> 3.0%); across the aux-ON pair the
#    restriction is worth ~22x (3.0% -> 65.1%). A multiplicative reading predicts this
#    cell near 65.1/10 = 6.5%. Measuring it separates "the emit loss writes the content"
#    from "the restriction erases it".
#
# ONE change from tul_a1: both aux weights zeroed (the same change tul_tg2 makes to
# tul_tg1). `ce_emit` / `ce_plast` stay metrics only — see tul.py's emit_weight docstring.
# Everything else, including max_slots 64 and the schedule, is tul_a1's.
defaults:
  - tul_a1
  - _self_

tul:
  plast_weight: 0.0
  emit_weight: 0.0

wandb:
  name: tul-a1-noaux
