# Slot-map levers panel, arm "slot-unpack-free": the unpack arm (tul_slot_unpack_norm_match)
# with the slot loop's two stability terms OFF — the gain hinge (slot_gain_lambda 100 @ 0.9)
# and the terminal fixed-point term (core_fixed_point_lambda 1.0). Both reward a map that
# stops moving the slot state; this arm asks whether they are what pins the slot map near
# the identity (movement 1-3 %/pass, K-curve flat with the coda forced onto z). The
# backward clip (slot_cot_clip 4.0) stays: it acts on the cotangent, not on the map, and
# alone it never held a spike (lab/divergence/DIVERGENCE-README.md). The tripwire guards.
# Record: lab/experiments/planned/2026-09-10-arc-slot-map-levers.md
defaults:
  - tul_slot_unpack_norm_match
  - _self_

model:
  slot_gain_lambda: 0.0
  core_fixed_point_lambda: 0.0

wandb:
  name: slot-unpack-free
