# TUL arm TG2 — the Thought-Gestalt restriction + TG's own single-objective recipe
# (docs/tul-tg-spec.md §8). Pre-registration: lab/experiments/planned/2026-08-27-tg-restriction.md
#
# THE DISCRIMINATOR IS LOOP WORTH AND CE VS THE CONTROL BAND, NOT THE LOSS ALONE.
# P3 asks whether removing the emit/plast double-label objective (the takeover's
# fuel, per the O5 objective-split result) also removes the takeover once the
# architecture — not an aux loss — is what forces context through the slot.
#
# tul_tg1 + emit_weight/plast_weight both zeroed: the slot's private one-token
# race carries no training gradient (ce_emit / ce_plast stay metrics only, see
# tul.py's emit_weight/plast_weight docstring). Everything else is tul_tg1.
defaults:
  - tul_tg1
  - _self_

tul:
  plast_weight: 0.0
  emit_weight: 0.0

wandb:
  name: tul-tg2
