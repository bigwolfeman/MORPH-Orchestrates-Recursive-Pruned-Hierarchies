# Slot-loop panel, arm "slot-spandec-strict-bcast": the strict ruler with the ONE-SHOT unpack
# (`tul.bcast`) switched on. ONE factor against `slot-spandec-strict`
# (`tul_slot_spandec_strict.yaml`): `tul.bcast: true`.
#
# WHAT IT IS. z_i, the previous slot's exit state (stream mean), goes through one of
# `bound_span_cap` offset-indexed linears (`TULSlots.W_bcast`, init 0) and is ADDED once to
# the coda INPUT of every token of span i+1 (`_forward_tul`, right after the token-state
# dropout). On the ruler the loop's output reaches a token only through an attention hop
# onto the prefix cells; here it also reaches every token of the next span directly.
# It ran once before, on 2026-09-10, on the M-next MUX family
# (`tul_slot_unpack_norm_match.yaml`) and read flat. It has never run on the strict
# geometry with the span-decoder target, where the loop is the only cross-span channel.
#
# WHY IT IS HERE. It is the "entry" twin of `slot-spandec-strict-bcast-all`, which adds the
# same term again at every coda layer through a zero-init gate. The pair separates "a
# direct read of z exists" from "the read is re-supplied at every layer".
#
# KERNELS. No knob. `bcast` is an einsum and a gather on the coda input and does not touch
# attention; the 09-10 unpack arm's `use_kernels: false` / `tg_scoped_kernels: true` came
# from its TG mask (`tg_restrict`), which the strict chain already configures.
#
# COST. `W_bcast` is `bound_span_cap x d x d` parameters (32 x 1024 x 1024 = 33.6 M at the
# panel shape; read the composed config for the exact dims) and a B.S.K.C^2 einsum per
# forward. No RNG draw (zero init), so the base weights equal the ruler's at the same seed
# and step 0 is the ruler's forward bit for bit (tests/test_tul_unpack.py).
#
# WHAT TO EXPECT. Stated before the run so the result is not over-read: the 09-10 reading
# was flat, so the prior is a small or zero change in the K-curve. Read the loop
# contribution (token K1-K6, worth_profile zero), not the final CE.
#
# Record: lab/experiments/planned/2026-09-22-arc-slot-token-like-read.md
defaults:
  - tul_slot_spandec_strict
  - _self_

tul:
  bcast: true

wandb:
  name: slot-spandec-strict-bcast
