# ARM L1 — the loop restored on the GL winner, FULL BPTT, uncontrolled.
#
# Prereg: lab/experiments/planned/2026-08-29-tul-loop-ladder.md. Decision context:
# .agents/notes/proposed/architecture/2026-08-29-loop-ladder.md.
#
# gl1b (gist mask + gradient-carrying write + MUX target) with the core loop turned
# back ON, and NOTHING protecting it: n_core 6, per-slot Poisson depth (mean 6, max 8),
# and bptt_depth 8 ≥ max_depth so NO iteration is truncated — the gradient of every
# loss crosses every realized iteration. This is the arm the "iterated write is fatal"
# claim forbids and the "instability, not iteration, is the disease" claim permits.
# The per-iteration loop probe (training.grad_probe_every=1 at launch) and the σ_max
# log decide WHY, not just whether: runaway shows as core_gain/delta_ratio compounding
# across t and σ_max growth; a clean run at healthy gain kills the fatal framing.
#
# The TUL slot geometry is what makes full BPTT affordable: the loop runs on the
# compact slot sequence (≤64 slots/row), not the token stream, and ckpt_grad_iters=-1
# checkpoints every grad-iteration (exact — memory only, never the gradient).
defaults:
  - tul_gl1b
  - _self_

model:
  n_core: 6
  bptt_depth: 8      # ≥ max_depth → zero no_grad iterations: FULL BPTT

wandb:
  name: tul-l1
