# Slot-loop panel, arm "slot-spandec-strict-prev": the STRONG form of the strict geometry.
# ONE factor against `slot-spandec-strict` (`tul_slot_spandec_strict.yaml`):
# `tul.tg_coda_prefix_reach`, "all" -> "prev".
#
# THE DIFFERENCE. Under reach "all" a coda token may read the prefix cells of EVERY earlier
# slot, so a span twelve spans back is one attention hop away and the chain of loop states
# is optional. Under "prev" a token may read only the cells of the slot that terminates the
# PREVIOUS span, so everything older has to have been carried forward by the loop itself,
# slot by slot. That is the geometry in which "the loop is the only cross-span channel"
# also means "depth is the only way to reach far back".
#
# THE PRICE, named rather than discovered later. The row's trailing tokens after the last
# boundary sit in the dump bin (`bag_id == max_slots`), which is not a span, so `bag_id - 1`
# does not name "their previous span" — the query is gated on `bag_id[i] < max_slots`, the
# same conservative reading `tul.tg_soft_prev_span` takes, and a dump-bin token therefore
# reads NO prefix cell at all under "prev" (under "all" it reads every one). At seq 1024
# with `max_slots` 64 a row usually ends on its 65th boundary and the tail is short or
# empty, but it is not always empty, and those tokens are supervised. Expect this arm to be
# worse than `slot-spandec-strict` for that reason alone; the reading is the loop
# contribution, not the CE.
#
# Record: lab/experiments/planned/2026-09-12-arc-strict-geometry.md
defaults:
  - tul_slot_spandec_strict
  - _self_

tul:
  tg_coda_prefix_reach: prev

wandb:
  name: slot-spandec-strict-prev
