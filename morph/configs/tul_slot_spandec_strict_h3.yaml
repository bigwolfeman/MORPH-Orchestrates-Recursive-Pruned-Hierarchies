# Slot-loop panel, arm "slot-spandec-strict-h3": the DOWNSTREAM target.
# ONE factor against `slot-spandec-strict` (`tul_slot_spandec_strict.yaml`):
# `tul.spandec_horizon`, 1 -> 3.
#
# WHY. The measured cross-span budget is NOT front-loaded: the upcoming text needs a FLAT
# 0.315 nats [0.3025, 0.3314] from across its boundary at EVERY offset eight or more
# tokens in, plus a 0.958 spike at the first position (lab/experiments/failures/
# 2026-09-11-arc-span-budget.md, 491,520 paired tokens at 5,000 steps). The H = 1 span
# decoder already moved the slot channel's worth from 0.115 to 0.182 nats, but its profile
# still DECAYS with offset (0.708 at offset 0 down to 0.068 at 16+). A target that ends at
# the next boundary cannot ask z for anything past that boundary — so the flat long-range
# part of the budget has nothing in the objective asking for it.
#
# WHAT CHANGES. The decoder's target becomes the concatenated tokens of spans s+1, s+2,
# s+3, teacher-forced, as ONE causal run of 3 x 32 = 96 positions from z. Slot cells are
# never in the target. A slot is supervised at block h only when span s+h exists AND is
# complete (the `span_slots` shift rule, the same "both slots exist" test the H = 1 target
# already uses), so a slot near the end of a row keeps the blocks it has and is masked on
# the rest. No h-dependent weight: every supervised TOKEN counts once, which is the
# convention the H = 1 term already has.
#
# COST, arithmetic. The decoder goes from 4.0 to 12.0 block-passes per token
# (2 layers x 64 slots x 32 tokens x 3, over ~1024 real tokens per row), so the arm is
# 22.7 against `slot-spandec-strict`'s 14.7 and the plain panel's 44. The [B, S, J, V]
# readout triples with it. Expect well under the ruler's rate; the smoke's tok/s against
# the 8,086 floor decides whether the arm runs at all, and that is a real risk on this one.
#
# THE COLUMN TO READ. `tul/spandec_ce_h` is the term optimised here — a per-token CE over
# three spans — and it is NOT comparable with any earlier arm's `spandec_ce`. The sweep's
# `spandec_ce` column stays the H = 1 PART, computed at eval only (a second full readout),
# so the comparison against `slot-spandec-strict` is like for like. The prediction this arm
# is FOR is the worth profile: if the downstream target is doing anything, it moves the
# 16+ offset bin more than the 0-3 bins.
#
# Record: lab/experiments/planned/2026-09-12-arc-strict-geometry.md
defaults:
  - tul_slot_spandec_strict
  - _self_

tul:
  spandec_horizon: 3

wandb:
  name: slot-spandec-strict-h3
