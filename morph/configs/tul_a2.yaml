# The 5090 panel of the paid loop (docs/tul-paid-loop-recipe.md): base.yaml's recipe on
# the short schedule every 2026-09 arm ran — 20k steps, seq 1024, dense (no prune /
# carve / route), TST off so TUL is on from step 0, batch 6. This is the config the
# matched 20k pair (lab/experiments/failures/2026-09-02-warmup-20k-pair.md) and every
# checkpoint under checkpoints/morph/tul-a2-* were trained and are re-built with.
# `notul.yaml` is its control: the same panel with the layout off.
defaults:
  - base
  - _self_

training:
  steps: 20000
  batch_size: 6
  prune_start: 999999999      # never (dense)
  compact_step: 999999999     # never (no carve)
  tst_bag_size: 0             # TST off: TUL is on from step 0 (invariant 6)
  eval_every: 250
  n_eval_batches: 20
  ckpt_every: 2500
  gen_every: 0                # the eager generator is a separate, explicit run

routing:
  route_start: 999999999      # never (no ReMoE)

data:
  seq_len: 1024

tul:
  activate_at: 0.0            # from step 0 (TST is off above)
  max_slots: 64               # the panel's slot budget at seq 1024 (spec §8 default is 128)

wandb:
  project: morph-tul
  name: tul-a2
