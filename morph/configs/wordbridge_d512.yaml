# Word-problem extraction bridge — continue-pretrain the d512 model to map NL word problems into
# its native symbolic proof-state trace (given:/goal:/check:), routing extraction INTO the intact
# compute circuit. Diagnosis: the model computes at ~0.99 gen_em on olympiad math but has no
# NL->symbolic-setup circuit, so on GSM8K it template-fills with fabricated arithmetic.
#
# 3-source blend : word-problems majority (the new skill), olympiad-math replay (protect the
# compute circuit from forgetting), small general-math prose (keep the NL reading side robust /
# anti-template-overfit).
#
# init_from = prepretrain-math-d512 step_46000 model weights (0.9989 olympiad gen_em, NLP-adapted,
# NO bad SFT template). Same MORPHConfig as that run so load is function-preserving.
#
# Launch (from MORPH repo, olympiad venv has the generators — though pretok blend is pre-tokenized):
# env -C <MORPH> OLYMPIAD_REPO=/mnt/sda1/Projects/00NN/Olympiad-AI PYTHONPATH=<MORPH> \
# PYTHONUNBUFFERED=1 /home/wolfe/.venv/bin/python -m morph.training.train \
# --config-name wordbridge_d512
defaults:
 - base
 - _self_

model:
 d_model: 512
 n_heads: 4
 n_kv_heads: 4
 d_ff: 1376
 vocab_size: 49169
 n_prelude: 4
 n_core: 0
 n_coda: 4
 mean_depth: 1
 max_depth: 1
 bptt_depth: 1
 ckpt_grad_iters: -1
 channel_dims: [256, 160, 96]
 compression: 2
 csa_compress_ratio: 8
 hca_compress_ratio: 256
 top_k: 256
 window_size: 256
 context_len: 512
 max_seq_len: 512
 lorentz_fraction: 0.25
 bigram_hash_vocab: 0
 n_ve: 3
 ce_chunk_size: 8192
 use_kernels: true
 hc_streams: 4
 hc_tau: 1.0
 hc_cayley_iters: 3
 hc_cayley_alpha: 0.1
 hc_init_gain: 0.1
 hc_use_kernel: true
 retention: true
 retention_layers: [1]
 retention_heads: 4
 retention_chunk: 128
 retention_gate_init: -6.0
 retention_carry: true
 retention_gate_bias: 2.0
 core_gain_clip: 0.0

training:
 init_from: ${oc.env:OLYMPIAD_REPO,/mnt/sda1/Projects/00NN/Olympiad-AI}/checkpoints/morph_seed_512_math_fullvocab/wordbridge_init_d512.pt
 ternary: true
 ternary_scope: backbone
 ternary_scale_group: tensor
 embed_quant: "int6"
 attn_proj_quant: "off"
 adam8bit: false
 bf16: true
 compile: false
 compile_mode: default
 dropout: 0.0
 prune_start: 999999999 # prune OFF
 compact_step: 999999999 # carve OFF
 cms_score_mode: grad
 steps: 5000 # ~164M tokens @ 32768 tok/step — short skill-teach + probe iteration
 lr_decay_steps: 5000 # cosine decay over the full short run
 tst_bag_size: 0 # TST OFF — superposition→recovery arc needs a long horizon; on a
 tst_ratio: 0.0 # 5000-step run it just burns 1500 steps corrupting inputs. Clean NTP.
 optimizer: ademamix_b1zero
 lr: 2.0e-4 # continue-pretrain from converged: modest peak, replay guards compute
 lr_schedule: cosine
 min_lr: 2.0e-5
 warmup: 300
 grad_clip: 1.0
 weight_decay: 0.1
 beta1: 0.9
 beta2: 0.95
 eval_every: 500 # NLP val ppl; olympiad gen_em + GSM8K probe measured OFFLINE on ckpts
 n_eval_batches: 20
 ckpt_every: 1000 # 5 checkpoints for the probe curve
 gen_every: 0
 seed: 0

routing:
 route_start: 999999999 # ReMoE OFF

curriculum:
 enabled: true
 pretok_dir: ${oc.env:OLYMPIAD_REPO,/mnt/sda1/Projects/00NN/Olympiad-AI}/data/wp_mix
 allowed_source_roles: [pretrain_bulk, reasoning_midtrain, posttrain_gold]
 eff_batch: 64 # micro_batch 32 x grad_accum 2
 blend:
 word_problems: 0.60 # role reasoning_midtrain — the NEW extraction skill (51M tok)
 olympiad_math: 0.25 # role reasoning_midtrain — compute-circuit protection (291M tok)
 finemath: 0.15 # role posttrain_gold — real NL-math prose, reading robustness (382M tok)
 stages:
 - {seq_len: 512, context_len: 512, micro_batch: 32, steps: 5000}

data:
 dataset: /home/wolfe/.cache/huggingface/datasets/openwebtext/**/openwebtext-train-*.arrow
 tokenizer: bigcode/starcoder2-7b
 seq_len: 512

wandb:
 project: MORPH-Math
 name: wordbridge-d512-v1
 tags: [morph-seed, wordbridge, gsm8k, extraction, replay, d512, ademamix]
