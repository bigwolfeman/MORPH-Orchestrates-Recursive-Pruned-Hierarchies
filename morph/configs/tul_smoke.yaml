# CPU / tiny smoke of the paid-loop TUL path: builds in seconds, runs 12 steps, exercises
# eval, checkpoint and the generator once. Used by the lifecycle tests and by hand before
# a real launch (`python -m morph.training.train --config-name tul_smoke`).
defaults:
  - tul_a2
  - _self_

model:
  d_model: 256
  n_heads: 4
  n_kv_heads: 2
  d_ff: 512
  n_prelude: 1
  n_core: 2
  n_coda: 1
  mean_depth: 2
  max_depth: 3
  bptt_depth: 2
  channel_dims: [128, 80, 48]
  max_seq_len: 1024
  context_len: 512
  csa_compress_ratio: 4
  hca_compress_ratio: 32
  top_k: 32
  window_size: 64
  retention_heads: 4
  retention_chunk: 32

training:
  steps: 12
  batch_size: 2
  eval_every: 5
  n_eval_batches: 2
  ckpt_every: 10
  gen_every: 10
  compile: false
  ternary: false
  adam8bit: false
  embed_quant: "off"

data:
  seq_len: 256

wandb:
  name: tul-smoke
