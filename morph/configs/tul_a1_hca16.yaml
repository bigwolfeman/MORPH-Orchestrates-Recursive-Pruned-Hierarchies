# TUL arm A1 with the core's HCA compressed branch ALIVE — campaign hypothesis H24.
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name tul_a1_hca16
#
# Everything is tul_a1.yaml. The ONLY difference is model.core_hca_compress_ratio.
#
# Why. Measured 2026-08-25 (lab/experiments/failures/2026-08-25-h18-positional-attention-sink.md
# Phase 0): the looped core runs on 64 SLOT positions while hca_compress_ratio is 256, so
# GatedPoolCompressor computes n_blocks = 64 // 256 = 0 and core blocks 1/3/5 output
# EXACTLY 0.0000 from their compressed branch — while the learned gate still spends
# g_comp ~ 0.50 of its mixture on that zero tensor. The token path (arm A0) at the same
# weights has n_blocks = 4 and |out_comp| ~ 1030. A1 diverges, A0 does not, and that is a
# measured architectural difference between them.
#
# 16, not 8 or 32. 64 // 16 = 4 blocks, which is exactly what the TOKEN path gets at
# seq_len 1024 (1152 // 256 = 4), so the core's compressed branch sees the same number of
# blocks on both paths. Untried: 8 (8 blocks) and 32 (2 blocks).
#
# SCOPED TO THE CORE. Setting model.hca_compress_ratio globally would also re-block the
# two prelude and two coda HCA layers, which run on all 1152 positions and do not have the
# problem — that would be an arm differing by seven modules instead of three.
#
# CONFOUND, declared: B_a is [m, c], so this arm has 15 360 FEWER parameters per HCA core
# block (256x64 -> 16x64, 46 080 fewer in total against 286.1 M, 0.016 %). It is NOT
# iso-parameter, in the direction that makes an improvement harder to explain as capacity.
defaults:
  - tul_a1
  - _self_

model:
  core_hca_compress_ratio: 16

wandb:
  name: tul-a1-hca16
