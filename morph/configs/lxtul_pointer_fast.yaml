# The winner (lxtul_pointer) with every speed key that passed its check on 2026-10-08:
# 230.0 ms/step = 26.7k tok/s on the 5090 (bench pairs 230.0 / 229.8; the trainer's replay rate
# reads ~30.5k), against 265 ms without the block-glue keys, 343 ms for the graph step alone and
# ~525 ms eager. Plan and per-key evidence:
# .agents/notes/proposed/architecture/2026-10-08-lxtul-training-speed-plan.md
#   exact (byte-identical gates): ckpt_grad_iters 0, slot_gain_no_ckpt, the dW skip (no key)
#   rounding only (fp64 parity + fixed-weight readout): tg_fused_attention, hc_fused_grad,
#     ternary_step_cache, fan_twin_compile, fan_div_fast, fan_lsel_pick_bf16, ce_softmax_kernel,
#     spandec_ce_row_cap, hc_region_fused, cca_prologue_tiled, inject_fold (forward bit-identical)
#   2026-10-10 (phase-2 tracker C2, sum order only, 45-step gate deviation in the tracker):
#     lmhead_row_cap (the token head on the rows a loss reads, a proven fixed cap), built, OFF here
#     until a 5k quality check; it saves only ~0.8 ms/step
#   training-function changes, paired continuations (lab/experiments/mixed|successes/2026-10-08-*):
#     fan_target_online (package check, mixed), slot_depth_stratified + slot_compact (success;
#     possible ~0.001 nat CE cost)
defaults:
  - lxtul_pointer_graph
  - _self_

model:
  tg_fused_attention: true
  hc_fused_grad: true
  ternary_step_cache: true
  ckpt_grad_iters: 0
  slot_gain_no_ckpt: true
  fan_twin_compile: true
  fan_div_fast: true
  fan_lsel_pick_bf16: true
  fan_target_online: true
  slot_depth_stratified: true
  slot_compact: gather
  spandec_ce_row_cap: true
  lmhead_row_cap: false   # C2: not exact, -0.8 ms, no 5k quality check yet; off until one
  hc_region_fused: true
  cca_prologue_tiled: true
  inject_fold: true

wandb:
  name: lxtul-pointer-fast
