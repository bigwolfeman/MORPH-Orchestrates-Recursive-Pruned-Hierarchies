# LCTUL, the graded arm's twin with the L2 regression still ON, "tul-code-grade-l2"
# (2026-09-17; docs/tul-code-spec.md §17.2).
#
# ONE factor against `tul_code_grade.yaml`: `code_target_weight` back at 1.0. The graded
# term reaches about four slots per step-equivalent (the rate ceiling), so on its own it is
# a thin gradient; this arm keeps the dense L2 target on every valid slot underneath it and
# asks whether the graded term adds anything on top. Read P-G6 of the prereg.
defaults:
  - tul_code_grade
  - _self_
tul:
  code_target_weight: 1.0
  code_grade_every: 8             # the dense L2 term trains every step underneath, so the
                                  # graded term can be amortised; 0.60x measured (Spark, 60
                                  # steps, against the same config with code_grade false).
wandb:
  name: tul-code-grade-l2
