# TUL arm v1c — NTP warmup for the MUX head (Wolfe's idea, 2026-08-27).
# Pre-registration: lab/experiments/planned/2026-08-27-warmup-sigreg-ntpdrop.md
# ONE change from tul_v1a2b (detach + beta 0.1, the best arm so far): the head
# stays off for the first 40% of the run, so the model builds representations on
# plain next-token prediction before being asked to predict next-span bags.
# Rationale: MUX starts from a PRETRAINED model. Ours was random-init and the
# head learned only the corpus marginal (7.03 vs unigram 7.32).
defaults:
  - tul_v1a2b
  - _self_

tul:
  mux_activate_at: 0.4      # step 1400 of 3500

wandb:
  name: tul-warmup
