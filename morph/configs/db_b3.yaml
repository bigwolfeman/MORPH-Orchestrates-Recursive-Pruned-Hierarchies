# DiffusionBlocks arm DB-2 — block-wise over prelude | core | coda (sheet §3.3).
#
# B=3 on MORPH's OWN seams, so the core stays weight-tied and no layers are added. The
# sigma range is split by probability mass 1/8 : 6/8 : 1/8 (block_mass null derives this
# from mean_depth), which makes the 1 + T + 1 inference Euler steps equal-mass at T=6.
# Block VISITS stay uniform at 1/3 each -- mass-proportional visits would give the prelude
# and coda 1/8 of steps, ~2500 effective updates over a 20k run against 20k today.
#
# Isolates: is block independence free? (prediction P2)
#
# Pre-registered (sheet §4.2): flop_proxy 4.67 (x0_inject) | s/step 0.33-0.47
# Run: PYTHONPATH=$PWD python -m morph.training.train --config-name db_b3
defaults:
  - tul_short
  - _self_

wandb:
  name: db-b3

db:
  activate_at: 0.0
  mode: b3
  conditioning: x0_inject
  # Pinned 2026-08-19: this historical arm ran the tied-readout CE objective
  # (Option B). The repo default flipped to loss_kind=l2 (Option A). Keep this
  # arm's recorded behavior explicit; new arms should use db_b1_l2.yaml.
  loss_kind: ce
  visit: uniform
