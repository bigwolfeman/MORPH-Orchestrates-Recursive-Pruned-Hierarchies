# Slot-map levers panel, arm "slot-unpack-noise-entry": the unpack arm with Parcae's loop
# entry (notul_parcae_entry's model block): the slot state starts as small noise and the
# prelude state e is re-injected on EVERY carrier dim through a learned B each iteration.
# Under the shipped prelude entry the slot state starts AS the prelude state and the map
# moves it 1-3 %/pass; the plain core under this entry moved 61/28/16 % on its first
# passes (per-pass-strength panel).
# Base: tul_slot_unpack_free (hinge and fixed-point term OFF), not the unpack arm. The
# first draw (03:13, on the unpack base) read loss/gain_est 8.63 at step 0 and a hinge
# penalty of 6,000 nats: the hinge's typical gain is not defined for an entry whose first
# pass grows the state by construction (0.02-std noise to the injected e). The free arm
# had just read the terms as not the pin (K1-K6 0.003), so this arm is one factor, the
# entry, against the free arm.
# Record: lab/experiments/planned/2026-09-10-arc-slot-map-levers.md
defaults:
  - tul_slot_unpack_free
  - _self_

model:
  injection_channels: all
  injection_all_decay: 0.447
  injection_all_dt: 0.8
  injection_B: true
  core_state_init: noise
  core_state_init_std: 0.02

wandb:
  name: slot-unpack-noise-entry
