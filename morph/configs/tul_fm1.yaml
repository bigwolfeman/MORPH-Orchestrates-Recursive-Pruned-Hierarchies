# ARM FM1 — the full TUL-FM training arm. THE MODEL-LEVEL EXPERIMENT.
#
# Run (the coordinator passes the schedule overrides on the CLI, exactly as the
# slot-pay panel arms did — see "CLI overrides" below):
#   PYTHONPATH=$PWD python -m morph.training.train --config-name tul_fm1 \
#     training.steps=4500 training.batch_size=6 training.eval_every=250 \
#     training.ckpt_every=500 training.ademamix_alpha_cap=3.5 \
#     model.use_kernels=false training.grad_probe_every=1
#
# WHAT IT IS. The tul_a1 skeleton — slots in the sequence, prefix_k=2, E_slot /
# E_mask / W_prefix, the coda attending slot prefixes, token_state_dropout 0.15 —
# with n_core: 0, so the core loop is GONE (A3's body). An FMPlanner produces the
# slot states instead: slot i's state is a PLAN for span i+1, generated by six Euler
# steps of a conditional-flow-matching velocity field conditioned on the prelude
# states at positions <= e_i.
#
# WHY IT CANNOT TAKE OVER. The plan is detach()ed before W_prefix. No gradient
# reaches the planner from the coda's CE and none reaches the backbone through the
# ladder, so there is no BPTT through an iterated map — the mechanism behind every
# takeover this campaign measured. Gated by
# tests/test_tul_fm1.py::test_coda_ce_never_reaches_the_planner.
#
# THE §5 AUX LOSSES ARE OFF. The FM term is the write pressure now.
#   emit_weight  0.0  — the slot's emitting position contributes nothing to the CE.
#   plast_weight 1.0  — see the note on that key below; this is NOT 0.
#
# CLI overrides the coordinator passes (kept OUT of this file on purpose, exactly as
# tul_a1 keeps the schedule in tul_short.yaml): training.steps=4500, batch_size=6,
# eval_every=250, ckpt_every=500, ademamix_alpha_cap=3.5, model.use_kernels=false,
# training.grad_probe_every=1. Everything a run needs is still logged, because
# train.py writes the RESOLVED config to wandb.
#
# PARAM BUDGET. A3 (n_core 0, no slots) is 207.7 M. FM1 adds the TUL slot machinery
# (E_slot, E_mask, W_prefix: prefix_k x d^2 = 2 x 1024^2 = 2.1 M, plus two 1024-vectors)
# and the planner (~22.0 M at d_p 512 x 4). Expect ~232 M. Printed at startup by
# MORPHTransformer and by the FM1 banner; if the printed number is not near 232, stop.
defaults:
  - tul_a2
  - _self_

model:
  # THE CORE LOOP IS GONE. This is what FM1 replaces, and build_fm_runtime refuses to
  # start if it is not 0.
  n_core: 0

training:
  # PINNED, per docs/tul-fm-probing.md §4 rule 5 ("written in blood"): a null
  # ademamix_t_beta3 silently falls back to training.steps, so the optimizer's beta3
  # horizon moves whenever the run length does. It cost three experiments on 2026-08-28.
  # 4500 is the value the slot-pay panel arms effectively ran (they were 4500 steps with
  # the null fallback), so FM1 matches them AND stops depending on the CLI.
  ademamix_t_beta3: 4500

tul:
  # The §5 double-label weights. `emit_weight: 0` removes the slot's emitting position
  # from the CE entirely — the FM loss is the write pressure now, so the slot no longer
  # races the free token path for the first token of the next span.
  emit_weight: 0.0
  # DELIBERATELY 1.0, NOT 0.0. `t_last` is an ORDINARY TOKEN position that happens to
  # predict the first token of the next span; the 0.5/0.5 split exists only so that
  # token is not counted twice when the slot ALSO predicts it. With emit_weight 0 there
  # is no double count left to correct, so the token gets its ordinary weight. Setting
  # this to 0 as well would silently drop ~1 in 20 token positions from training —
  # and they are the exact tokens a plan is supposed to help with. The result is
  # "ordinary token CE over token positions, slot positions contributing nothing",
  # which is what the arm's spec asks for. Verified: n_targets == n_tokens.
  plast_weight: 1.0
  # Bowman word dropout on the coda's token input, unchanged from tul_a1: the read
  # pressure that gives the coda a reason to consult a plan at all.
  token_state_dropout: 0.15

fm:
  enabled: true
  objective: cfm
  infer_steps: 6
  # x0 ~ N(0, I). NOTE, and read the [MISMATCHED] line the model prints at startup:
  # the targets are UNIT L2 in 1024 dims, so their per-component std is 1/sqrt(1024)
  # = 0.03125 and the MATCHED source scale is that, not 1.0. At 1.0 the source carries
  # 1024x the variance of the target and E||v||^2 = 1 + 1024 instead of ~2, so the
  # velocity the planner fits is dominated by reconstructing x0 — the DeepWeightFlow
  # App. H failure mode and the direct analogue of P1's sigma_data scar. Shipped at 1.0
  # because the arm spec says N(0, I); `fm.source_std=0.03125` is the one-token sweep.
  source_std: 1.0
  fm_weight: 1.0
  loss_scale: auto       # -> ~1025 at source_std 1.0, so the fm term starts near 1.0
  sigreg_lambda: 0.02
  sigreg_slices: 1024

wandb:
  name: tul-fm1
