# LCTUL, LaDiR chain, stage 2 of 3 — the thinker, teacher-forced on the oracle tape.
# Resume the stage-1 checkpoint (`tul-code-vae/step_10000.pt`) with E, the prelude, the
# embeddings, the slot module AND THE CODA frozen (LaDiR's decoder never trains again);
# only the thinker learns, on the flow loss against the frozen code, with the encoder's
# truth tape as context (LaDiR reasoning-model stage 1, teacher forcing). Batch 12: the
# frozen token path stores no activations (as tul_code_thinker.yaml). The coda's noise /
# dropout settings stay as in stage 1 so its (frozen) statistic is unchanged.
#   training.resume=/home/wolfe/morph-to/checkpoints/morph/tul-code-vae/step_10000.pt
defaults:
  - tul_code_vae
  - _self_
training:
  batch_size: 12
  steps: 40000                    # 30k thinker steps after the 10k resume point
  ckpt_every: 10000
  ademamix_t_beta3: 30000
  resume_fresh_optimizer: true
  train_only:                     # the thinker and nothing else (model 4:6x6:4 -> core injections 4..9)
    - core.
    - x0_injects.4.
    - x0_injects.5.
    - x0_injects.6.
    - x0_injects.7.
    - x0_injects.8.
    - x0_injects.9.
    - injection.
    - tul_code_head.
    - tul_code_time.
    - tul_code_cell
    - tul_code_clean
tul:
  code_phase2_at: 0.0             # flow loss from the first resumed step
  code_phase3_at: 1.0             # the coda never reads a sample in training
wandb:
  name: tul-code-ladir-tf
