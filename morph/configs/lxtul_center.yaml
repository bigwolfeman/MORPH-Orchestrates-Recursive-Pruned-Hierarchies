# LXTUL with the slot loop's core attention CENTERED (2026-10-05, the carrier-constant
# twin). One factor from lxtul.yaml: tul.loop_attn_center off -> ema. Each slot-loop core
# block's attention sublayer reads x_bar - mu_l, mu_l a per-layer fp32 buffer: the
# bias-corrected EMA (decay 0.99, the default) of x_bar's mean over the valid slot cells
# of every pass of a training forward, frozen at eval. No parameter. 5000 steps, to pair
# with lxtul's 5k seeds.
# Note: .agents/notes/proposed/architecture/2026-10-05-slot-loop-carrier-constant.md
# Prereg: lab/experiments/planned/2026-10-05-carrier-constant-twin.md
defaults:
  - lxtul
  - _self_

tul:
  loop_attn_center: ema

training:
  steps: 5000

wandb:
  name: lxtul-center
