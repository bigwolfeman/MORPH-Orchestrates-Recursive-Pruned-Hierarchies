# ARM DB-COND — deviation-#1 falsifier: the OLD db_loop shape + iteration conditioning.
#
# CLAUDE.md "faithful DiffusionBlocks" mission's stated deviation #1: `tul.db_loop`
# (arm L3) trained a detached-carry unrolled loop with NO signal telling any
# iteration which iteration it was. This arm keeps L3's exact loop shape (db_loop:
# true, db_mux_iters: 4 — everything else = tul_l3, which is tul_l1 + db_loop) and
# adds ONLY the missing piece: `core_stage_cond: iter` gives every core-layer
# application in that same loop an AdaLN-Zero signal for its iteration index
# (morph/model/iter_cond.py). If L3's depth-inertness was caused by the missing
# conditioning alone, this arm should show iteration-specialised behaviour that L3
# does not; if it does not, the fault is elsewhere (the detached carry itself, or the
# per-iteration local mux supervision) and this arm falsifies deviation #1.
defaults:
  - tul_l3
  - _self_

tul:
  core_stage_cond: iter
  db1_cond_dim: 256

wandb:
  name: tul-db-cond
