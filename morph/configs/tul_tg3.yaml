# TUL arm TG3 — soft Thought-Gestalt restriction (docs/tul-tg-spec.md §6): the window
# branch's allow relation gains one more disjunct, the PREVIOUS span (not just the
# current one and the slots). Pre-registration: lab/experiments/planned/2026-08-27-tg-restriction.md
#
# THE DISCRIMINATOR IS LOOP WORTH AND CE VS THE CONTROL BAND, NOT THE LOSS ALONE.
# Per the pre-registration's decision rule: run ONLY if TG1's ce_main crosses the
# pre-registered line (both seeds > 0.6 nats over the control band's upper edge).
# Do not run this arm on a hunch — it exists to answer "was TG1's restriction too
# tight to carry context at this scale", not to fish for a better number.
defaults:
  - tul_tg1
  - _self_

tul:
  tg_soft_prev_span: true

wandb:
  name: tul-tg3
