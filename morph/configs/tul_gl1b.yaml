# ARM GL1b — GL1 + the MUX write-target loss. THE "SLOTS DON'T CARRY ENOUGH" ARM.
#
# GL1 fired the content gate (worth_shuffle 0.05-0.07, wrong-value 0.33-0.43) and still
# cost 0.34 nats against its unrestricted twin. The diagnosis is bandwidth, not routing:
# the gisting pipe works and what goes down it is thin. MUX (arXiv 2607.18264, read in
# full) is the prescription — supervise the latent to be a LOSSLESS multiplexed record of
# the span it stands for, which their Prop. 9 shows also prevents the latent collapse
# SIGReg was aimed at.
#
# Run GL1b:
#   PYTHONPATH=$PWD python -m morph.training.train --config-name tul_gl1b \
#     training.steps=4500 training.batch_size=6 training.eval_every=250 \
#     training.ckpt_every=500 training.ademamix_alpha_cap=3.5 training.grad_probe_every=1
#
# Matched control (unrestricted; everything else identical):
#   ... same ... tul.tg_restrict=false wandb.name=tul-gl1b-ctrl
#   NOTE the control is config-matched but NOT parameter-matched: tg_restrict replaces
#   the HCA compressed branch, so the control carries 2.037M more params (+0.98%).
#   Pinned by tests/test_tul_gl1.py::test_the_control_is_config_matched_but_NOT_...
defaults:
  - tul_gl1
  - _self_

tul:
  # ── MUX local loss (paper Eq. 2/3/4; Table 9 hyperparameters) ────────────
  # Every knob below is the paper's own Table 9 value, which is also what MORPH already
  # defaulted to: rho 0.9 (geometric), tau 1.0, beta 1.0. `mux_beta` IS the paper's
  # beta in "L = L_answer + beta*L_local + gamma*L_global" — same symbol, same role, so
  # no `mux_lambda` alias was added.
  mux_beta: 1.0
  mux_rho: 0.9
  mux_tau: 1.0

  # THE ONE REAL DEPARTURE FROM THE SHIPPED MUX ARM: the slot is supervised toward its
  # OWN span, not the next one. Our slot is the MEMORY of the span it terminates and,
  # under tg_restrict, the only route a later token has to that span — MUX's latent
  # likewise STANDS FOR the CoT step it replaced. "next" is the plan/forecast framing
  # every arm before GL1 used and remains the default everywhere else.
  mux_target: own

  # DETACH OFF, per the paper (train through the tied unembedding) — AND THIS IS THE
  # KNOWN-DANGEROUS SETTING. arm v1a with detach OFF diverged and aborted at step 2800
  # while its control ran healthy past 3250
  # (lab/experiments/failures/2026-08-25-mux-head-arm-v1a.md), which is why the GLOBAL
  # default in TULConfig is True and stays True. It is set false HERE, for this arm
  # only, because the paper's Eq. 3 trains through W and GL1b is the arm testing the
  # paper's recipe. Watch val/mux_embed_grad_share from step 0: MEASURED 0.395 at init
  # on the tiny model — and 0.402 with detach ON, because the gradient also reaches the
  # table through the slot SEED (E_slot + W_sent.embed(t_last)), so detaching the head
  # does NOT isolate the embedding table in this architecture. If the share climbs,
  # the FM2 failure mode (an auxiliary reshaping the shared features its own targets are
  # built from) is in progress.
  mux_detach_head: false
  mux_activate_at: 0.0

  # SIGReg OFF — isolate the MUX target. MUX Prop. 9 shows lossless multiplexing itself
  # prevents the latent collapse that SIGReg was added to attack, so running both would
  # confound "did the target help" with "did the regulariser help". The knobs stay
  # independent so mux+sigreg can compose in a later arm.
  sigreg_lambda: 0.0

wandb:
  name: tul-gl1b
