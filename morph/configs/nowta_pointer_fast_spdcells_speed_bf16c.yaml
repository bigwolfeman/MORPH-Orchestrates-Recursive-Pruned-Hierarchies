# The speed base (nowta_pointer_fast_spdcells_speed) + the HC carrier stored in bf16 with fp32
# math and an fp32 carrier for the gain hinge (model.hc_carrier_bf16). 5k, 480 rows, one run:
# CE@6 3.8996, K1-K6 +0.0052 (speed base 3.8985 / +0.0053):
# lab/experiments/failures/2026-10-12-fan-speed-lever-split.md. Generation and other
# no-autocast paths raise with this key (open item in the phase-2 tracker).
defaults:
  - nowta_pointer_fast_spdcells_speed
  - _self_

model:
  hc_carrier_bf16: true

wandb:
  name: nowta-pointer-fast-spdcells-speed-bf16c
