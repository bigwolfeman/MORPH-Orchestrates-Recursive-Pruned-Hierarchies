# The speed base (nowta_pointer_fast_spdcells_speed) + the HC carrier stored in bf16 with fp32
# math and an fp32 carrier for the gain hinge (model.hc_carrier_bf16). 5k, 480 rows, one run:
# CE@6 3.8996, K1-K6 +0.0052 (speed base 3.8985 / +0.0053):
# lab/experiments/failures/2026-10-12-fan-speed-lever-split.md; free against matched fp32
# controls (2 seeds each): lab/experiments/successes/2026-10-12-bf16-carrier-matched-controls.md.
defaults:
  - nowta_pointer_fast_spdcells_speed
  - _self_

model:
  hc_carrier_bf16: true
  # S1 + S2 (2026-10-12, exact: byte gate FINAL_SHA256 unchanged with both on): the gain hinge on
  # its own stream, the block linears' weight grads on a second stream. Bench off 199.26 -> 177.22
  # ms/step (1.124x, interleaved, 2 repeats). Cost: graph pool +1.15 GiB, about 0.34 GiB free after
  # eval with ~4.5 GB of desktop VRAM in use; a game on the desktop can OOM the eval.
  slot_gain_stream: true
  split_wgrad: true
  # S5 (2026-10-13): each block compiles as one graph (HC entry/exit, CCA conv, segment conv, tiled
  # prologue as torch.library custom ops). Not exact: each merged graph draws its own dropout seed.
  # Bench 171.70 -> 167.85 ms/step (1.0229); 5k, 2 seeds vs matched controls: CE@6 -0.0047, K1-K6
  # 102 % (lab/experiments/successes/2026-10-13-s5-custom-ops-5k.md). Cold compile +46 s.
  block_custom_ops: true
  # G1 (2026-10-13): Triton GEMMs inside split_linear (needs split_wgrad). Pinned bench on S5 171.07 ->
  # 164.21 ms/step; 5k, 2 seeds on the Poisson base: CE@6 -0.0024, K1-K6 118 %, cell knob unchanged
  # (lab/experiments/successes/2026-10-13-g1-triton-gemm-5k.md).
  split_wgrad_triton: true
  # K1 (2026-10-13): the CCA conv and prologue-rows backward re-tiled, weight-grad partials summed in
  # one fixed-order kernel (sum order only). Pinned bench 164.12 -> 160.20 ms/step. 5k, 3 seeds:
  # CE@6 +0.0003, K1-K6 87.7 % (paired -0.0003 +- 0.0005); Wolfe accepted it on 2026-10-13 because
  # the 95 % rule is tighter than the seed noise (lab/experiments/failures/2026-10-13-k1-5k.md).
  kv_flat_kernels: true

# Eval beside the held CUDA-graph pool (no release / re-record): the training trace and every
# val key are bit-identical to false (graph-step-survives-eval note); 23.2 -> 16.3 s per eval.
training:
  eval_keep_graphs: true
  # Wolfe 2026-10-12: the ablation / probe block (75 % of eval) on every 4th eval; the RNG is
  # forked around eval so the training stream does not depend on this number.
  eval_diag_every: 4

wandb:
  name: nowta-pointer-fast-spdcells-speed-bf16c
