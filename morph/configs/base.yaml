# MORPH base config — growth-compatible local rung.
# Exact nested family: d512 seed -> d1024 base -> d2048 cloud.
# Cloud target: 4:8:4, d_model=2048
# Local: 4:6:4, d_model=1024
#
# This is the SINGLE canonical default config reflecting the validated winning deploy stack:
#   - MORTAR sparse backend (ternary backbone, 0.25 BCSR via morph/sparse/stk)
#   - Routing ON (whole-body ReMoE; route_start = training-phase schedule, not an on/off gate)
#   - Quant stack: ternary MLP backbone + int6 embeddings + adam8bit
#   - HC Cayley n=4 (JPmHC winner, fused Triton kernel default)
#   - LoopSSM base mechanism (DiagonalInjection, always-on; ablation arms #232 are NOT included)

model:
  d_model: 1024
  n_heads: 8
  n_layers: 14  # n_prelude + n_core + n_coda
  d_ff: 2816    # seed 1408 x2; cloud 5632 /2; 128-aligned for MORTAR
  vocab_size: 49169  # StarCoder2 + 17 Olympiad structure/control tokens
  max_seq_len: 4096

  # Parcae loop
  n_prelude: 4
  n_core: 6
  n_coda: 4
  mean_depth: 6
  max_depth: 8
  bptt_depth: 4
  # L1 core-gain governor: cap per-iteration looped-core amplification ‖h_new‖/‖h_a‖ per
  # sample to ratio τ. 0.0 = OFF (bit-identical). Identity when gain≈1 (norm-preserving
  # HC residual); only fires on gain runaway (weight-shared core amplifies T× per depth).
  # Typical τ≈1.5–2.0.
  core_gain_clip: 0.0
  # Selective core-loop checkpointing (throughput knob). Checkpoint the first N of the bptt_depth
  # grad-iterations; later ones run eager (activations retained → no backward recompute → faster),
  # at the cost of retained activation memory. -1 = checkpoint ALL (default, bit-identical/safest).
  # Exact — never changes gradients (ppl-neutral). Tune down against VRAM headroom to raise tok/s.
  ckpt_grad_iters: -1

  # Channel slices used by DiagonalInjection and final mixing. The residual carrier is HC.
  channel_dims: [512, 320, 192]  # seed x2; cloud /2

  # Attention (CCA+CSA+HCA, all features baked in)
  compression: 2
  n_kv_heads: 4
  csa_compress_ratio: 8
  hca_compress_ratio: 256
  top_k: 256
  window_size: 256
  context_len: 8192  # common CoPE taper anchor across seed/base/cloud

  # Embeddings
  lorentz_fraction: 0.25  # 576 eucl + 192 Lorentz
  bigram_hash_vocab: 49152
  n_ve: 0                 # disable value-embedding tables in the hotpath

  # LM head fused cross-entropy chunk size (rows of B·T per chunk).
  # Smaller = less peak VRAM, more launch overhead. Tune per target.
  ce_chunk_size: 1024

  # Master kernel switch: true = fused Triton attn + fused CE (optimised);
  # false = eager references + full-logits CE (un-optimised A/B baseline).
  use_kernels: true

  # Residual = Hyper-Connection (JPmHC, Cayley) — the sole supported residual. Orthogonal
  # n-stream mixer: exact dynamical isometry, 5.2× cheaper H^res than Sinkhorn. Widens the
  # residual stream to hc_streams parallel C-dim streams ([B,S,n,768]) network-wide.
  hc_streams: 4            # expansion rate n (paper default); residual carrier → [B,S,n,768]
  hc_tau: 1.0              # softmax temperature for Hpre/Hpost
  hc_cayley_iters: 3       # Cayley fixed-point steps (paper s=2; 3 = safety margin)
  hc_cayley_alpha: 0.1     # Cayley step size α
  hc_init_gain: 0.1        # W_fused init: smaller → closer to plain residual at init
  hc_use_kernel: true      # fused Triton HC kernels (cayley+cuda). false ⇒ eager refs (bit-faithful,
                           # slower) — the reference arm for the fused-vs-eager parity A/B.

  # Sparse MLP backbone: prelude+core+coda all use MortarLinear (CMS-prunable +
  # MORTAR 128×128 BCSR via morph/sparse/stk) — always on, no scope knob.
  # Constraint: all dims must be divisible by tile_size=16. d_model=1024 and d_ff=2816
  # are also 128-aligned so the live MORTAR carve path has no partial blocks.

  # ── GLA Retention branch (#230) ──────────────────────────────────────────
  # Gated Linear Attention added in PARALLEL to the windowed attention in the 2nd layer
  # (retention_layers) of prelude/core/coda — a global-context / cross-iteration memory branch.
  # Off → GLA not constructed → bit-identical to baseline.
  retention: true
  retention_layers: [1]          # within-section layer index that gets the branch (0-based)
  retention_heads: 8             # d_head=128; seed 4 x2, cloud 16 /2
  retention_chunk: 256           # GLA chunk length; larger=faster (launch-bound)
  retention_gate_init: -6.0      # branch-gate logit; sigmoid(-6)≈0.0025 → ≈ identity at init
  retention_carry: true          # core: carry GLA state across loop iterations (false → reset)
  retention_gate_bias: 2.0       # GLA forget-gate logit bias (α near 1 = long memory)

training:
  # docs/tul-gate-spec.md §10: fail the run if the gate direction is still at its zero
  # init by this step (⇒ the parameter is frozen and the gate emits a constant).
  gate_alive_check_step: 2000
  steps: 100000
  batch_size: 4
  # Applied at train start (Python/torch/numpy RNG) before model build or data.
  # Default 0 matches the historical implicit getattr(tr, "seed", 0) behaviour.
  seed: 0
  lr: 1e-4
  warmup: 0                       # validated mortar winner (phase_c_mortar_full25k_scratch): NO warmup
  lr_schedule: cosine            # cosine with min_lr==lr ⇒ FLAT 1e-4 (winner recipe; flat LR intentional)
  min_lr: 1e-4                   # == lr → flat LR the whole run (do NOT add cosine decay; validated)
  dropout: 0.1
  grad_clip: 1.0
  bf16: true
  compile: true
  compile_mode: default
  checkpointing: true

  # Pruning → MORTAR carve → routing schedule (Phases 2→3→4)
  # Prune cadence at d=1024/d_ff=2816. With 128x128 blocks, gate_up has 44x8=352
  # blocks and down has 8x22=176. The down projection is the bottleneck: at 0.5%
  # prune_step_blocks()'s progress floor drops one block/event, requiring 132 events to
  # reach 44/176=0.25. interval=167 provides 156 events from the first eligible multiple
  # (3006) through the last pre-carve multiple (28891), so every unprotected layer reaches
  # target before carve@29000. The prune→0.25 window MUST close before compact_step, else
  # carve() freezes a still-dense model. Protection masks can intentionally plateau above it.
  # NOTE: prune completes inside the TST superposition window; carve@29000 and route@30000
  #  align with the superposition→recovery boundary.
  prune_start: 3000
  prune_interval: 167            # 156 eligible events before carve; >=132 required by down projection
  prune_rate: 0.005              # down drops at the one-block/event floor; gate_up initially drops two
  target_density: 0.25
  compact_step: 29000            # carve smooth-shadow → BCSR mortar_data (was 20000; moved to clear the slower ramp)
  cms_score_mode: taylor         # winner prune saliency (NOT grad); Taylor helps post-prune recovery (B3>B1)

  # ── Token Superposition Training (TST, #231 — Nous arXiv 2605.06546) ──
  # Two-phase curriculum: superposition (bag_size=s tokens/position, multi-hot CE) for
  # [0, tst_ratio·steps), then recovery (bag_size=0, standard NTP) for the remainder.
  # eval/gen ALWAYS use bag_size=0; tst_bag_size=0 ⇒ bit-identical to no-TST.
  # Paper sweet spot s=6, ratio=0.3. At steps=100000 ⇒ superposition [0,30000), recovery [30000,100000).
  # SCHEDULE NOTE: the superposition phase contains prune(3k–27k)/carve(29k); route(30k) engages at
  #   the superposition→recovery boundary — sparse structure is built under superposition, then
  #   recovers on 70k steps of clean NTP. Historical TST evidence was −4% ppl at d=768/15k
  #   on a quant-ONLY stack (#231); the new d1024 family member remains to be re-benchmarked.
  tst_bag_size: 6                # s: tokens superposed per position (0 = TST off)
  tst_ratio: 0.3                 # fraction of steps in the superposition phase

  # Optimizer extras
  optimizer: ademamix_b1zero      # adamw (with adam8bit=true → bnb AdamW8bit fallback) |
                                 # ademamix_b1zero (β1=0 fork: 2 buffers → AdamW8bit memory
                                 # parity, vs bnb's 3-buffer +50%; ~+1% step overhead).
                                 # (The stock 3-buffer `ademamix` path was removed.)
  weight_decay: 0.1
  # Core-map spectral-norm penalty: soft hinge L=lambda·Σ relu(σ_max(W)−cap)² over
  # core MLP linears (gate_up/down). Caps σ_max runaway without forcing σ_max≤1
  # (healthy values ~1.5; cap~3 only fires on runaway). Loss-side → optimizer-agnostic.
  # OFF when cap or lambda ≤ 0 (exact baseline). See morph/training/spectral_penalty.py.
  spectral_penalty_cap: 0.0
  spectral_penalty_lambda: 0.0
  spectral_penalty_n_iter: 1
  # σ_max logging cadence (steps). Independent of the penalty: with lambda=0 the
  # penalty is an exact zero, so this only ADDS the diagnostic. 0 = off.
  spectral_penalty_log_every: 100
  # PRE-CLIP per-region / per-block gradient norms + the looped-core state probe
  # (GLA carried-state norm and realized per-iteration core gain), every N steps.
  # The existing gradnorm/* block is POST-clip and every 100 steps; the TUL core
  # takeover onset lasts about 140 steps, so 100-step post-clip sampling cannot see
  # inside it. Costs one fused _foreach_norm and one host sync per probed step.
  # 0 = off, and off is bit-exact (the model-side flag is never set).
  grad_probe_every: 0
  # Optional local JSONL mirror of the probe (one object per probed step). null = wandb
  # only. Set it per-run; the onset analysis reads this file rather than the wandb API.
  grad_probe_path: null
  beta1: 0.9
  beta2: 0.95                     # NOTE: AdEMAMix paper recommends beta2=0.999 — set per-arm.
  # ── AdEMAMix (only used when optimizer=ademamix) ──
  # AdamW + a 2nd very-slow momentum EMA (decay beta3) mixed in with weight alpha.
  # STABILITY: t_alpha/t_beta3 are the optimizer's OWN alpha/beta3 warmup horizons (NOT LR
  # warmup) — a large beta3 active from step 0 diverges even with LR warmup. null → default to
  # training.steps (essential; bnb pins beta3 at full strength from step 0 if these are None).
  beta3: 0.999                   # (b1zero) slow-EMA decay. 0.999 = validated deploy default (<100k).
  ademamix_beta2: 0.999          # (b1zero) AdEMAMix beta2, decoupled from the shared AdamW beta2
                                 # (paper rec 0.999). The shared `beta2` above stays the AdamW default.
  ademamix_alpha: 8.0            # fast/slow mix weight (paper LM default 8; 5 = conservative)
  ademamix_alpha_cap: 3.5        # (b1zero) Hard cap on scheduled α_t. The per-block gain
                                 # runaway threshold is α_t≈4.3–4.5; cap at 3.5 to sustain
                                 # max stable AdEMAMix drive without crossing the threshold. 0=off.
  ademamix_t_alpha: 8000         # (b1zero) α warmup horizon (validated). null → training.steps
  ademamix_t_beta3: null         # null → training.steps
  ademamix_beta3_warmup_start: 0.9  # (b1zero only) β3-warmup START decay; β1=0 makes the
                                 # paper's log(β1) schedule degenerate, so we ramp from here.
  ademamix_fused: true           # (b1zero) true = fused Triton kernel (faster opt.step).
                                 # With linear-int8 state quant the fused path is lossy on
                                 # small-ν lanes (underflow→explode or over-floor→throttle), so
                                 # ademamix_fused_dynamic_qmap=true (also the default) eliminates
                                 # that bias → the default path is NOT lossy. false = de-fused: bnb dynamic blockwise
                                 # qmap (same quant as AdamW8bit; preserves small ν, no bias).
  ademamix_fused_dynamic_qmap: true   # (b1zero, fused only) Replace the fused kernel's uniform
                                 # linear-int8 state quant with bnb's non-linear dynamic map
                                 # (signed m2, unsigned ν stored directly, no sqrt/floor) —
                                 # the same quantizer as the de-fused reference, eliminating
                                 # systematic denom bias. Same ~2.03 B/param memory.
  ademamix_fused_nu_floor: true  # (b1zero, LINEAR fused only) legacy code-1 floor on sqrt(ν)
                                 # (prevents int8 underflow→0). Exposed only to A/B-attribute the
                                 # linear tax (floor-bias vs resolution). Ignored when dynamic_qmap.
  ademamix_eps_inside: false     # (b1zero) false = √(ν/bc2)+ε true-Adam normalization (default).
                                 # true = √(ν/bc2+ε) safety floor (floored at √ε≈1e-4) —
                                 # required for the fused linear-int8 kernel where ν can underflow
                                 # to exactly 0; throttles live small-ν params on the de-fused
                                 # dynamic-qmap path (ν never underflows there, _mask_dead_state
                                 # handles pruned positions). DEFAULT false = correct for the deploy
                                 # path (fused+dynamic-qmap) and de-fused; use true only for linear fused.
  ademamix_update_clip: 5.0      # (b1zero) per-coord cap on the (g+α·m₂)/denom step in
                                 # Adam units (healthy step ≈O(1)). 0 = off. Bounds the
                                 # per-step param change so a prune topology-shock (ν lags
                                 # the gradient jump) cannot blow up a few coords in one step.
                                 # Only fires on anomalous coords → no convergence throttle.
  # β1=0 noise-gating fix (b1zero, de-fused) — restore Adam's implicit noise filter without
  # an m1 buffer. β1=0 puts raw g in the numerator; on noise-dominated coords this is a
  # unit-variance random walk every step (standard Adam's fast EMA averages it away; β1=0
  # cannot). Two stateless knobs restore the filter (β1=0 2-buffer memory win preserved):
  ademamix_g_coef: 1.0           # γ: constant downscale of the raw-g numerator term (γ·g + α·m₂).
                                 # Crude (1−β1) mimic — damps ALL coords uniformly (throttles signal
                                 # too). Cheap CONTROL for the gate below. 1.0 = off. Try ~0.1–0.3.
  ademamix_g_snr_gate_kappa: 0.3 # κ: SOFT per-coord SNR gate. snr=|m₂|/denom ≈ |mean|/rms; gate =
                                 # floor+(1−floor)·clamp(snr/κ,0,1); numerator = gate·g + α·m₂. Noise
                                 # coord (snr→0)→gate=floor (~10× cut, = Adam); signal coord (snr≈1)→
                                 # gate=1 (full AdEMA advantage); fresh spike auto-gated (ν leads m₂).
                                 # THE root-cause fix. 0.0 = off. Try κ~0.3 first, sweep 0.2–0.5.
  ademamix_g_snr_gate_floor: 0.1 # gate floor (min raw-g weight on a pure-noise coord). ≈(1−β1)=0.1
                                 # matches Adam's noise damping; >0 so learning never fully stalls.
  ademamix_stale_push_cap_coord: 0.5  # Per-coordinate stale-push cap (b1zero): |α·m₂_i| ≤ c·|g_i|
                                 # on each coord (vs the per-tensor cap's whole-tensor norm). The
                                 # failure mode is per-coord magnitude domination: stale slow-EMA
                                 # huge where the live gradient collapsed — the few collapsed coords
                                 # are hidden by the tensor-level norm. Sign preserved.
                                 # 0.0=off; recommended c≈0.5. Smaller = tighter bound.
                                 # History: see Ai-notes/06-21-2026/AdEMAMix-b1zero-Divergence-Cure/TROUBLESHOOTING.md
  ademamix_track_diag: false     # per-tensor optimizer telemetry (snr-gate mean/low, clip/cap counts).
                                 # OFF saves ~67ms/step on the de-fused path (454-tensor sync loops);
                                 # param update is BIT-IDENTICAL either way. true → for optimizer-debug.

  # ── Deploy quant stack (ALL ON by default — validated winners) ──
  # Ternary QAT: forward-STE on weights → {-1,0,+1}×scale. Training ppl IS deployed-ternary ppl.
  ternary: true
  ternary_scope: backbone        # MLP/mix/mhc proj; attn projections stay bf16
  ternary_threshold: 0.5         # |w/scale| > threshold → nonzero (Bonsai default)
  ternary_scale_mode: symmetric  # symmetric wins at this scale (A-series result)
  ternary_scale_group: tensor    # per-tensor scale
  ternary_scale_dtype: fp16      # fp16 scale storage
  ternary_scale_clip_mult: 0.0   # Per-group upper bound on ternary scale γ=mean(|W|), anchored
                                 # at this × initial γ (prevents blowup from ratcheting the scale
                                 # upward). γ is the full magnitude carrier of {-1,0,+1}×γ weights
                                 # → caps layer output magnitude. Optimizer-independent backstop.
                                 # 0=off; typical range 3–8×. Symmetric mode only.

  # 8-bit AdamW via bitsandbytes (quantizes optimizer state m,v to uint8)
  adam8bit: true

  # Embedding int6 QAT. Per-row int6 STE on euc+bigram (Lorentz stays bf16 — geometry-sensitive).
  embed_quant: "int6"            # off | int8 | int6. QUOTED: bare off is YAML bool False.
  lm_head_quant: "off"           # off | int6. QUOTED.

  # Attention-projection int8 QAT. Per-output-row int8 STE on CCA Linears. Disjoint from ternary backbone.
  attn_proj_quant: "off"         # off | int8 | int6 | int4. QUOTED. Winner=off (reproduces validated 33.82);
                                 # int8 is a deploy opt-in that needs its own 25k validation before becoming default.

  # FP8 was dead at the former d=768 scale (small-GEMM regime); ternary and FP8 are
  # mutually exclusive per-layer. The d1024 family member remains to be re-benchmarked.
  fp8: false
  fp8_recipe: dynamic
  fp8_scope: mlp
  fp8_filter_min_dim: 256

  # Evaluation / logging
  eval_every: 500
  n_eval_batches: 20
  ckpt_every: 2500
  gen_every: 0      # 0 = disabled; set e.g. 5000 for generation samples
  gen_test: false   # run generation test at end of training

  # Resume — path to a checkpoint for a FULL resume ("like nothing happened": model +
  # carve/route topology + optimizer + scaler + RNG + step + pruning phase). null = fresh
  # run. Must be a real key (not commented) so `training.resume=<path>` works from the CLI.
  resume: null
  # FORK-continue: with a resume path set, start a FRESH optimizer (no inherited momentum) and
  # skip the data-stream replay. For new experiments off a checkpoint (A/B forks) where a
  # faithful "like nothing happened" resume is NOT wanted — both arms start identical, no stale
  # slow-EMA confound. Default false = faithful full resume (optimizer state restored + replay).
  resume_fresh_optimizer: false

# Routing — whole-body ReMoE (prelude+core+coda). ALWAYS ON in the hotpath.
# route_start = training-phase schedule: routing code activates at this step.
# (There is no "routing off" code path — routing is unconditional in the forward pass
#  once the carve has been applied. route_start just gates the training-time routing head.)
routing:
  route_start: 30000             # engage ReMoE 1000 steps after carve (compact 29000); = TST superposition→recovery boundary
  route_scope: all               # whole-body ReMoE (14 physical MLPs); "core" would route only the 6 core blocks
  n_clusters: 16
  activation_ratio: 0.5
  aux_loss_coeff: 0.01
  aux_detach_input: true         # feed router x.detach() → load-balance aux grad stays out of
                                 # the looped carrier (prevents OOM from extended BPTT depth)

# ── TUL — Thought Unpack Loop (docs/tul-spec.md §8) ───────────────────────────
# The Parcae core loops over one SLOT per span of text instead of over every token.
# activate_at: never ⇒ NO TUL parameters are constructed and the forward never sees a
# slot layout ⇒ bit-identical to plain MORPH (runtime-invariants §6b). That is the
# default here because base.yaml is the validated deploy recipe and TUL has no evidence
# yet; it is also arm TUL-A0. The arms live in tul_short.yaml + tul_a*.yaml and set
# activate_at: 0.0 (spec §5 [W]: TUL layout from step 0, TST off).
tul:
  activate_at: never       # never | 0.0 (from step 0) | fraction of steps (e.g. ${training.tst_ratio})
  slot_token: "<fim_pad>"  # QUOTED; resolved to an id at build, asserted absent from the corpus
  boundary_chars: ".;!?"   # a token ENDING in one of these cuts a span. NO comma [W].
  boundary_substrings: ["\n", "—", "–", "--"]   # …or CONTAINING one of these
  min_span: 4              # suppress a boundary below this span length (spec §3.1 rule 3)
  span_cap: 32             # force a boundary at this span length [W] (rule 4)
  max_slots: 0             # 0 → seq_len // 8 (the fixed slot budget; L_total = seq_len + prefix_k·max_slots)
  prefix_k: 2              # coda positions per slot, by projection from ONE looped state [W]
                           # (Block Transformer App. F.2 / Fig 3f: length 2 beats 1). 1 = arm TUL-prefix1.
  token_state_dropout: 0.15   # Bowman word dropout on the coda's token input; 0 = off, arm sweep {0, 0.15, 0.3}
  slot_mean_depth: 0       # 0 → model.mean_depth (per-slot Poisson depth [W])
  slot_max_depth: 0        # 0 → model.max_depth
  coda_sees_slots: true    # false = arm TUL-A4 (slots gathered OUT of the coda sequence)
  tokens_through_core: false  # true = arm TUL-A2 (slots-as-memory: tokens keep the core)
  # Arms specified in spec §3.5 but NOT implemented in v1. A non-default value RAISES
  # (a silently-ignored config key is worse than a missing one) — do not run them yet.
  stp_lambda: 0.0          # arm: punc-STP on the slot trajectory
  set_lambda: 0.0          # arm: slot-set multi-hot warm-up
  carry: false             # arm: explicit W·h_{i-1} into slot i+1's input
  xattn: false             # arm: per-layer cross-attention branch to the slots
  bcast: false             # arm: AU-Net broadcast-add of h_i over the next span's tokens
  fixed_stride: 0          # >0 = arm TUL-A5: a slot every N tokens, punctuation rule off
  # ── The span-length gate (docs/tul-gate-spec.md). `gate: false` builds NOTHING:
  # no parameter, no layout field, no random draw — the arm is TUL-A1 (§9 invariant 1).
  gate: false              # true = arms TUL-gate / TUL-halt
  gate_k_max: 40           # the regression DENOMINATOR (k = round(g·k_max)), NOT the
                           # largest k: the model never asks for more than span_cap.
                           # 1.25 × span_cap on purpose. Measured on OWT at span_cap 32,
                           # 24.5 % of labels are a span of exactly 32 — with k_max = 32
                           # a quarter of the signal would sit on the target g = 1.0,
                           # which a sigmoid never reaches. The headroom puts the largest
                           # target at 0.8 and cuts the q10…q90 logit spread the gate must
                           # cover from 10.90 to 3.33.
  gate_lambda: 1.0         # weight of the length term. 1.0 = the predecessor's lambda_g
                           # (coconut/tul/config.py:81), the setting its gate worked under.
  gate_train_zeros: false  # §6 AMENDED. true = also supervise g→0 on every iteration
                           # before a slot's last (the "k=0, keep thinking" half of the
                           # encoding). OFF, and the reason is arithmetic: the Poisson
                           # depth is independent of the input, so no head can know which
                           # iteration is the last — the optimum of that target is the
                           # HAZARD, which multiplies the length away. Measured: k=5.00
                           # against gold 18.98 at step 40, matching the hazard table to
                           # the integer. Stop belongs in the separate head of §12.
  gate_budget_cond: true   # §5: add budget_embed(span_len) to the slot state before the
                           # coda. false reproduces the predecessor's defect (the decoder
                           # was never told k), and is the ablation that isolates §5.
  gate_truncate_p: 0.15    # §3.2: per-span probability of an extra RNG boundary. Teaches
                           # the coda to stop on a BUDGET rather than on punctuation, and
                           # makes the next span start mid-unit (§3.1's jitter, same knob).
  gate_huber_beta: 1.0     # the Huber knee; 1.0 = the predecessor's delta default
  gate_drives_depth: false # true = arm TUL-halt. EVAL ONLY — training always teacher-forces
                           # the depth (§4), so one run scores both arms.
  gate_seed: 0             # seeds the truncation rng; in the config so the run reproduces
  # §12: specified and NOT implemented. A non-default value RAISES.
  gate_scheduled_sampling: 0.0
  gate_stop_head: false
  gate_ponder_lambda: 0.0

data:
  # datasets>=4.x dropped script datasets; load from locally-cached OWT arrow shards instead.
  # Portable default: HF datasets cache under $HOME (override if shards live elsewhere).
  # OFFLINE once cached. Script ids like Skylion007/openwebtext do not load under datasets>=4.
  dataset: ~/.cache/huggingface/datasets/openwebtext/**/openwebtext-train-*.arrow
  tokenizer: bigcode/starcoder2-7b
  seq_len: 4096

# Hardware-adaptive shard placement + prefetch (docs/data-placement-design.md).
# Measured per token blob at loader init; one report line per source — never silent.
# Env overrides: MORPH_DATA_PLACEMENT / MORPH_DATA_RAM_FRAC / MORPH_DATA_RAM_RESERVE_GB /
# MORPH_DATA_PROBE / MORPH_DATA_PREFETCH.
data_runtime:
  placement: auto          # auto | ram | mmap | stream (stream = tier C, phase 2)
  ram_budget_frac: 0.5
  ram_reserve_gb: 16
  probe: true              # rand-4K p50 + sequential microbench of the actual file
  prefetch_batches: 4      # 0 = synchronous (bit-exact repro escape hatch)
