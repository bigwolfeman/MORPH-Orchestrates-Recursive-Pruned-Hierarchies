# Slot-loop panel, arm "slot-ultralight-coda": take the coda's headroom away.
# One factor against `slot-spandec-strict` — the prelude/coda SPLIT, with the block count
# conserved at 14 (n_prelude 4 -> 7, n_coda 4 -> 1, n_core unchanged at 6).
#
# THE HYPOTHESIS. Every reading says the coda does not need z. Its loss is flat to 0.0005
# nats under a 10 % rms perturbation of the exit state and moves 0.001-0.003 nats per pass
# (`critic_gap_traj`, lab/experiments/planned/2026-09-12-arc-core-token-and-critic.md);
# zeroing the whole slot channel costs 0.186 (`worth_profile --plan-mode zero` on the
# strict ruler); the token K-curve is +0.0016. A four-block coda that already reconstructs
# most of what it needs from the span's own tokens has no reason to lean on a cell. A
# ONE-block coda cannot do that work itself, so whatever it still gets right across a span
# boundary has to arrive through the cells.
#
# This is a CONTROL, and a cheap one: no new code, no new parameter kind, one config. It
# is also the arm most likely to be read backwards, so the reading is fixed in advance —
# the headline is NOT the CE (a 1-block coda will almost certainly be worse; a 5k CE
# cannot rank architectures, the standing rule). The headline is the SLOT CHANNEL'S SHARE:
# token K1-K6 against strict's +0.0016 and `all_slots` worth against strict's 0.1865.
#
# Block count conserved so the arm is not also a capacity cut: 7 + 6 + 1 = 14 = 4 + 6 + 4.
# The prelude grows because that is where the span's own summary is built, and the
# register/geometry work all reads the prelude's output.
#
# Record: lab/experiments/planned/2026-09-13-arc-ultralight-coda.md
defaults:
  - tul_slot_spandec_strict
  - _self_

model:
  n_prelude: 7
  n_coda: 1

wandb:
  name: slot-ultralight-coda
