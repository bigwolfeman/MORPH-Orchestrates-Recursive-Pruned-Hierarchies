# TUL arm v1a-2a — v1a with the readout DETACHED, beta unchanged at 1.0.
# Pre-registration: lab/experiments/planned/2026-08-26-mux-detached-head-v1a2.md
# Isolates ONE change against the failed v1a: the auxiliary no longer trains the
# weight-tied embedding table. beta stays 1.0 so the comparison to v1a is clean.
defaults:
  - tul_v1a
  - _self_

tul:
  mux_detach_head: true
  mux_beta: 1.0

wandb:
  name: tul-v1a2a
