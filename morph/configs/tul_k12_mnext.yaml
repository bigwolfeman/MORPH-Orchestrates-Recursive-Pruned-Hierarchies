# ARC E12, the k=12 panel: M-next (Y2, no mask — tokens keep the direct route) at a FIXED
# slot depth of 12. The unmasked reference for tul_k12_mnext_mask.yaml.
# Prereg: lab/experiments/planned/2026-09-07-arc-e12-k12-panel.md
defaults:
  - tul_to_mnext_y2
  - _self_

model:
  bptt_depth: 12                 # full BPTT through all 12 (Y2: 8 = full at max 8)
tul:
  slot_depth_fixed: 12           # EVERY valid slot loops exactly 12 times, train and eval
  slot_max_depth: 12

wandb:
  name: k12-mnext
