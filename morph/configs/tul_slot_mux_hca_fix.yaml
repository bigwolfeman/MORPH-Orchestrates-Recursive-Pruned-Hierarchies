# Slot-loop panel, arm "slot-mux-hca-fix": the ruler with its core's HCA compressed branch
# ALIVE. `model.core_hca_compress_ratio: 16` — one factor against `slot-mux-norm-match`
# (`tul_slot_mux_norm_match.yaml`), which this file composes. Nothing else moves.
#
# Why: audit finding F1
# (lab/experiments/results/2026-09-10-slot-geometry-audit/README.md). `GatedPoolCompressor`
# computes `n_blocks = S // m`. The slot loop runs the core on `tul.max_slots` = 64 cells
# with `hca_compress_ratio` 256, so `n_blocks = 0`, `fused_hca_attention` attends an empty
# stream, and `_gate_combine_up` blends the gate weight into a zero tensor. Measured LIVE at
# step 5000 on this exact ruler: `|out_comp|` is exactly 0.000 on core blocks 1, 3 and 5
# with `g_comp` 0.42-0.52 there, while the SAME weights on a 1,152-position token sequence
# output 680-830 at the same gate value. Three of six core blocks deliver about half the
# attention output they were built for, silently, for a whole run.
#
# 16, not 8 or 32. 64 // 16 = 4 blocks, exactly what the token path gets at seq_len 1024
# (1152 // 256 = 4), so the core's compressed branch sees the same number of blocks on both
# shapes. 32 gives 2 (the floor); anything at or above 64 is the defect again
# (tests/test_tul_hca_fix.py).
#
# SCOPED TO THE CORE. `model.hca_compress_ratio` set globally would also re-block the two
# prelude and two coda HCA layers, which run on all 1,152 positions and do NOT have the
# problem — that would be an arm differing by seven modules instead of three.
#
# CONFOUND, declared, unchanged from `tul_a1_hca16.yaml`: `B_a` is [m, c], so this arm has
# 15,360 FEWER parameters per HCA core block (256x64 -> 16x64; 46,080 in total against
# 268 M, 0.017 %). NOT iso-parameter, in the direction that makes an improvement harder to
# explain as capacity and a regression ambiguous.
#
# PRIOR, stated so this does not read as a first run of the ratio: `tul_a1_hca16.yaml` ran
# this same knob on 2026-08-25 (H24,
# lab/experiments/failures/2026-08-25-h24-hca-branch-arm-binary.md) on the PRE-norm_match A1
# recipe at batch 12, alpha_cap 3.5, 6,000 steps, scored on ONE binary question — does the
# revived branch stop the takeover divergence. It does not. That arm never measured loop
# contribution, never ran under `ternary_scale_mode: norm_match`, and never carried the MUX.
# This arm asks the depth question on the current ruler.
#
# What this arm is NOT expected to do: the audit's own control says F1 is not the cause of
# the flat K-curve, because `slot-unpack-free` avoids the pooled compressor entirely
# (`tg_restrict` does not even build it) and reads K1-K6 0.0018. That control differs from
# the ruler in its coda, its objective and its stability terms as well as in its compressed
# branch, which is why one repaired ruler is worth having.
#
# Record: lab/experiments/planned/2026-09-10-arc-slot-mux-hca-fix.md
# Note: .agents/notes/proposed/architecture/2026-09-10-slot-loop-readout-and-attention-defects.md
defaults:
  - tul_slot_mux_norm_match
  - _self_

model:
  core_hca_compress_ratio: 16

wandb:
  name: slot-mux-hca-fix
