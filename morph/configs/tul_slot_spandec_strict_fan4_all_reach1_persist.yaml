# LXTUL-R Step 2: the decay fix, `tul.loop_carry: persist` on top of Step 1
# (`tul_slot_spandec_strict_fan4_all_reach1.yaml`). One factor: `tul.loop_carry` — a
# per-cell state that KEEPS what the cell read from its neighbours, the SAME accumulator
# `sum` builds (plain addition, no parameter), but NEVER handed back into the loop.
# `sum` / `gate` re-inject the accumulator at the entry of every later pass, and that
# re-supply is the measured failure this Step answers: it REPLACES the pass-1 read and
# dilutes the far hops instead of adding to them (carry RMS 0.5 -> 75 over a run,
# lab/experiments/failures/2026-09-19-loop-carry-prev-reach1.md). `persist` accumulates
# the same per-cell read every pass but adds the WHOLE sum exactly ONCE, at the loop's
# exit, RMS-matched to the exit carrier and masked to valid cells — the map every later
# pass runs (the gain hinge, the terminal fixed-point term, `slot_state_renorm`, every
# forced-depth sweep) is therefore bit-identical to `loop_carry: none`, so this arm keeps
# the direct pass-1 read rather than replacing it, and bounds the state by construction
# (one carrier-RMS worth of the accumulated direction, however long the accumulator has
# summed) rather than by an unbounded re-supply.
#
# `sum` / `gate` are refused on a Thought Register (`tul.slot_cells > 1`) because the
# register's in-loop relation widens core layer 0's window branch to include LATER cells
# of a cell's own slot, so the captured read there is not purely the cross-slot content
# those modes were measured on. `persist` is not refused there: the map is untouched at
# every pass regardless of what the captured read contains, so the register concern does
# not apply to it — that is what makes this arm buildable on Step 1's fan4-all-reach1
# geometry at all (morph/model/tul.py).
#
# Record: .agents/notes/proposed/architecture/2026-09-21-lxtul-r-reach-composition.md
# ("Step 2, the decay fix, only if Step 1 reproduces the decay row" — filed at Step 1b,
# c0f6bc4: planted g=2 kept 62% of its arrival worth from depth 1 to depth 6, the decay
# row reproduces).
defaults:
  - tul_slot_spandec_strict_fan4_all_reach1
  - _self_

tul:
  loop_carry: persist

wandb:
  name: slot-spandec-strict-fan4-all-reach1-persist
