# Slot-loop panel, arm "slot-loop-norm-match": THE SLOT LOOP (the real TUL: only the slot
# positions loop in _tul_core, W_prefix writes the looped state into the prefix positions,
# tokens pass prelude and coda once; tokens_through_core false through tul_short.yaml) with
# NO MUX, on the think-once panel recipe (tul_to_a1: seq 1024, batch 6, seed 1, 5000 steps,
# the ramp, the gain constraint and the fixed-point term from base.yaml), under the shipped
# ternary rule (ternary_scale_mode: norm_match, base.yaml since 2026-09-09). The slot loop
# had never run under norm_match: every slot-loop reading before this was absmean.
# Control: tul_slot_loop_absmean.yaml (the same arm under the old rule).
# Record: lab/experiments/planned/2026-09-09-arc-slot-loop-norm-match.md
defaults:
  - tul_to_a1
  - _self_

training:
  ternary_scale_mode: norm_match

wandb:
  name: slot-loop-norm-match
